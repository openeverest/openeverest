# Shared contract for array field rules.
# Go: provider-runtime/uischema (Validate) reports `issues`.
# UI: preprocessSchema drops every array field with an issue, so it is neither
#     rendered nor sent and an edit keeps its saved value. The toggleable rules
#     then run as if the field weren't there.
cases:
  - name: a key/value map owning its path is rendered
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              labels:
                uiType: array
                outputType: object
                path: spec.labels
                fieldParams: { label: Labels }
                itemTemplate: { uiType: keyValue }
              replicas: { uiType: number, path: spec.replicas, fieldParams: { label: Replicas } }
    issues: []

  - name: a list of strings is not supported yet
    uiSchema:
      replicaSet:
        sections:
          backup:
            components:
              databases:
                uiType: array
                outputType: array
                path: spec.backup.databases
                fieldParams: { label: Databases }
                itemTemplate: { uiType: text }
    issues:
      - { rule: array-unsupported, topology: replicaSet, field: backup.databases }

  - name: a map of objects is not supported yet
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              users:
                uiType: array
                outputType: object
                path: spec.users
                fieldParams: { label: Users }
                itemTemplate:
                  uiType: group
                  components:
                    role: { uiType: text, path: role, fieldParams: { label: Role } }
    issues:
      - { rule: array-unsupported, topology: replicaSet, field: advanced.users }

  - name: an array without an outputType or itemTemplate is not supported
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              labels: { uiType: array, path: spec.labels, fieldParams: { label: Labels } }
    issues:
      - { rule: array-unsupported, topology: replicaSet, field: advanced.labels }

  - name: a field writing inside the map overlaps it
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              labels:
                uiType: array
                outputType: object
                path: spec.labels
                fieldParams: { label: Labels }
                itemTemplate: { uiType: keyValue }
              team: { uiType: text, path: spec.labels.team, fieldParams: { label: Team } }
    issues:
      - { rule: array-overlap, topology: replicaSet, field: advanced.labels }

  - name: a field writing a path the map sits in overlaps it
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              annotations:
                uiType: array
                outputType: object
                path: spec.proxy.annotations
                fieldParams: { label: Annotations }
                itemTemplate: { uiType: keyValue }
              proxy: { uiType: text, path: spec.proxy, fieldParams: { label: Proxy } }
    issues:
      - { rule: array-overlap, topology: replicaSet, field: advanced.annotations }

  - name: a field in another section writing the same path overlaps the map
    uiSchema:
      replicaSet:
        sections:
          basic:
            components:
              labels: { uiType: text, path: spec.labels, fieldParams: { label: Labels } }
          advanced:
            components:
              labels:
                uiType: array
                outputType: object
                path: spec.labels
                fieldParams: { label: Labels }
                itemTemplate: { uiType: keyValue }
    issues:
      - { rule: array-overlap, topology: replicaSet, field: advanced.labels }

  - name: a path sharing only a prefix does not overlap
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              labels:
                uiType: array
                outputType: object
                path: spec.labels
                fieldParams: { label: Labels }
                itemTemplate: { uiType: keyValue }
              labelsMode: { uiType: text, path: spec.labelsMode, fieldParams: { label: Mode } }
    issues: []

  - name: two maps writing the same path both overlap
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              labels:
                uiType: array
                outputType: object
                path: spec.labels
                fieldParams: { label: Labels }
                itemTemplate: { uiType: keyValue }
              moreLabels:
                uiType: array
                outputType: object
                path: spec.labels
                fieldParams: { label: More labels }
                itemTemplate: { uiType: keyValue }
    issues:
      - { rule: array-overlap, topology: replicaSet, field: advanced.labels }
      - { rule: array-overlap, topology: replicaSet, field: advanced.moreLabels }

  - name: a multi-path map overlaps through any of its paths
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              podLabels:
                uiType: array
                outputType: object
                path: [spec.engine.podLabels, spec.proxy.podLabels]
                fieldParams: { label: Pod labels }
                itemTemplate: { uiType: keyValue }
              proxyTeam: { uiType: text, path: spec.proxy.podLabels.team, fieldParams: { label: Team } }
    issues:
      - { rule: array-overlap, topology: replicaSet, field: advanced.podLabels }

  - name: an unsupported array writes nothing, so a map on the same path stays
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              labelList:
                uiType: array
                outputType: array
                path: spec.labels
                fieldParams: { label: Label list }
                itemTemplate: { uiType: text }
              labels:
                uiType: array
                outputType: object
                path: spec.labels
                fieldParams: { label: Labels }
                itemTemplate: { uiType: keyValue }
    issues:
      - { rule: array-unsupported, topology: replicaSet, field: advanced.labelList }

  - name: a toggleable holding only an unsupported array has nothing to switch off
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              backup:
                uiType: group
                groupType: toggleable
                components:
                  databases:
                    uiType: array
                    outputType: array
                    path: spec.backup.databases
                    fieldParams: { label: Databases }
                    itemTemplate: { uiType: text }
    issues:
      - { rule: array-unsupported, topology: replicaSet, field: advanced.backup.databases }
      - { rule: toggleable-no-fields, topology: replicaSet, group: advanced.backup }
