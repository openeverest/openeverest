# Shared contract for what a rendered list field ignores or can't use, and for
# limits no form of it can meet.
# `*textItem` repeats the item the second case declares.
# Go: provider-runtime/uischema (Validate) reports `issues`.
# UI: preprocessSchema renders the field anyway and ignores the part it can't
#     use; lintRowsFields reports the same rules, as a dev-time warning.
cases:
  - name: a list with the options it supports has no issue
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              sourceRanges:
                uiType: list
                path: spec.proxy.sourceRanges
                fieldParams:
                  label: Source ranges
                  addButtonLabel: Add range
                  helperText: Who may connect
                  defaultValue: [10.0.0.0/8]
                  disableRemove: true
                  modes: { edit: { defaultValue: [], disableAdd: true } }
                validation:
                  required: true
                  min: 1
                  max: 5
                  unique: true
                  celExpressions:
                    - { celExpr: "!has(spec.proxy.sourceRanges) || !('0.0.0.0/0' in spec.proxy.sourceRanges)", message: Too open }
                  modes:
                    edit:
                      max: 10
                      unique: false
                      celExpressions:
                        - { celExpr: "!has(original.spec.proxy.sourceRanges) || has(spec.proxy.sourceRanges)", message: Keep an entry }
                itemTemplate:
                  uiType: text
                  fieldParams:
                    label: Range
                    placeholder: 10.0.0.0/8
                    helperText: In CIDR notation
                    type: password
                    modes: { edit: { disabled: true } }
                  validation:
                    min: 9
                    max: 43
                    trim: true
                    regex: { pattern: '^[0-9a-f.:/]+$', message: Use CIDR notation }
                    modes: { edit: { max: 18 } }
    issues: []

  - name: regex on the list is ignored, in a mode branch too
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              args:
                uiType: list
                path: spec.args
                fieldParams: { label: Arguments }
                validation:
                  regex: { pattern: '^-', message: A flag }
                itemTemplate: &textItem
                  uiType: text
              flags:
                uiType: list
                path: spec.flags
                fieldParams: { label: Flags }
                validation:
                  modes:
                    edit:
                      regex: { pattern: '^-', message: A flag }
                itemTemplate: *textItem
    issues:
      - { rule: list-ignored-option, topology: replicaSet, field: advanced.args }
      - { rule: list-ignored-option, topology: replicaSet, field: advanced.flags }

  - name: CEL, a default and a badge on the item are not supported yet
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              args:
                uiType: list
                path: spec.args
                fieldParams: { label: Arguments }
                itemTemplate:
                  uiType: text
                  validation:
                    celExpressions: [{ celExpr: "self != ''", message: Set }]
              flags:
                uiType: list
                path: spec.flags
                fieldParams: { label: Flags }
                itemTemplate:
                  uiType: text
                  fieldParams: { defaultValue: --verbose }
              sizes:
                uiType: list
                path: spec.sizes
                fieldParams: { label: Sizes }
                itemTemplate:
                  uiType: text
                  fieldParams: { badge: Gi }
              limits:
                uiType: list
                path: spec.limits
                fieldParams: { label: Limits }
                itemTemplate:
                  uiType: text
                  fieldParams: { badgeToApi: true }
    issues:
      - { rule: list-ignored-option, topology: replicaSet, field: advanced.args }
      - { rule: list-ignored-option, topology: replicaSet, field: advanced.flags }
      - { rule: list-ignored-option, topology: replicaSet, field: advanced.limits }
      - { rule: list-ignored-option, topology: replicaSet, field: advanced.sizes }

  - name: the item's default or CEL in a mode is not supported yet either
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              args:
                uiType: list
                path: spec.args
                fieldParams: { label: Arguments }
                itemTemplate:
                  uiType: text
                  fieldParams:
                    modes: { new: { defaultValue: --verbose } }
              flags:
                uiType: list
                path: spec.flags
                fieldParams: { label: Flags }
                itemTemplate:
                  uiType: text
                  validation:
                    modes:
                      edit:
                        celExpressions: [{ celExpr: "self != ''", message: Set }]
    issues:
      - { rule: list-ignored-option, topology: replicaSet, field: advanced.args }
      - { rule: list-ignored-option, topology: replicaSet, field: advanced.flags }

  - name: the item is the same field in every form mode, so it can't be hidden in one
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              args:
                uiType: list
                path: spec.args
                fieldParams: { label: Arguments }
                itemTemplate:
                  uiType: text
                  modes: { edit: { uiType: hidden } }
    issues:
      - { rule: list-ignored-option, topology: replicaSet, field: advanced.args }

  - name: the item takes no options from an API yet
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              secrets:
                uiType: list
                path: spec.secrets
                fieldParams: { label: Secrets }
                itemTemplate:
                  uiType: text
                  dataSource: { provider: secrets }
    issues:
      - { rule: list-ignored-option, topology: replicaSet, field: advanced.secrets }

  - name: a default that is not a list of strings is ignored
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              ports:
                uiType: list
                path: spec.ports
                fieldParams:
                  label: Ports
                  defaultValue: [8080, http]
                itemTemplate: *textItem
              labels:
                uiType: list
                path: spec.labels
                fieldParams:
                  label: Labels
                  defaultValue: { team: db }
                itemTemplate: *textItem
              args:
                uiType: list
                path: spec.args
                fieldParams:
                  label: Arguments
                  defaultValue: --verbose
                itemTemplate: *textItem
    issues:
      - { rule: list-invalid-default, topology: replicaSet, field: advanced.args }
      - { rule: list-invalid-default, topology: replicaSet, field: advanced.labels }
      - { rule: list-invalid-default, topology: replicaSet, field: advanced.ports }

  - name: a mode's default that is not a list of strings is ignored too
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              args:
                uiType: list
                path: spec.args
                fieldParams:
                  label: Arguments
                  modes: { new: { defaultValue: [[--verbose]] } }
                itemTemplate: *textItem
    issues:
      - { rule: list-invalid-default, topology: replicaSet, field: advanced.args }

  - name: min above max lets no list pass
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              args:
                uiType: list
                path: spec.args
                fieldParams: { label: Arguments }
                validation: { min: 3, max: 2 }
                itemTemplate: *textItem
    issues:
      - { rule: list-invalid-limits, topology: replicaSet, field: advanced.args }

  - name: a limit must be a whole number of 0 or more
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              args:
                uiType: list
                path: spec.args
                fieldParams: { label: Arguments }
                validation: { max: 1.5 }
                itemTemplate: *textItem
              flags:
                uiType: list
                path: spec.flags
                fieldParams: { label: Flags }
                validation: { min: -1 }
                itemTemplate: *textItem
    issues:
      - { rule: list-invalid-limits, topology: replicaSet, field: advanced.args }
      - { rule: list-invalid-limits, topology: replicaSet, field: advanced.flags }

  - name: a mode branch takes the shared limits, so they can clash with its own
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              args:
                uiType: list
                path: spec.args
                fieldParams: { label: Arguments }
                validation:
                  max: 1
                  modes: { edit: { min: 2 } }
                itemTemplate: *textItem
    issues:
      - { rule: list-invalid-limits, topology: replicaSet, field: advanced.args }

  - name: a mode branch that doesn't inherit the shared limits doesn't clash with them
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              args:
                uiType: list
                path: spec.args
                fieldParams: { label: Arguments }
                validation:
                  max: 1
                  modes: { edit: { inheritShared: false, min: 2 } }
                itemTemplate: *textItem
    issues: []

  - name: the item's own min and max count characters, so they may be anything a text field takes
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              args:
                uiType: list
                path: spec.args
                fieldParams: { label: Arguments }
                validation: { min: 1, max: 2 }
                itemTemplate:
                  uiType: text
                  validation: { min: 63, max: 3 }
    issues: []

  - name: required on the item does nothing, since a row is an entry only once it holds a value
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              args:
                uiType: list
                path: spec.args
                fieldParams: { label: Arguments }
                itemTemplate:
                  uiType: text
                  validation: { required: true }
              flags:
                uiType: list
                path: spec.flags
                fieldParams: { label: Flags }
                itemTemplate:
                  uiType: text
                  validation:
                    modes: { edit: { required: true } }
    issues:
      - { rule: list-ignored-option, topology: replicaSet, field: advanced.args }
      - { rule: list-ignored-option, topology: replicaSet, field: advanced.flags }
  - name: a list that needs an entry, opens with none and lets none be added can never pass
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              needed:
                uiType: list
                path: spec.args
                fieldParams: { label: Arguments, disableAdd: true }
                validation: { required: true }
                itemTemplate: *textItem
              short:
                uiType: list
                path: spec.argsB
                fieldParams: { label: Arguments, disableAdd: true, defaultValue: [--verbose] }
                validation: { min: 2 }
                itemTemplate: *textItem
    issues:
      - { rule: list-unsatisfiable-limits, topology: replicaSet, field: advanced.needed }
      - { rule: list-unsatisfiable-limits, topology: replicaSet, field: advanced.short }

  - name: a list that opens with the entries it needs may forbid adding
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              enough:
                uiType: list
                path: spec.args
                fieldParams: { label: Arguments, disableAdd: true, defaultValue: [--verbose, --quiet] }
                validation: { required: true, min: 2 }
                itemTemplate: *textItem
              free:
                uiType: list
                path: spec.argsB
                fieldParams: { label: Arguments, disableAdd: true }
                validation: { max: 2 }
                itemTemplate: *textItem
    issues: []

  - name: an entry of the default that the form reads as an empty row is no entry
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              blank:
                uiType: list
                path: spec.args
                fieldParams: { label: Arguments, disableAdd: true, defaultValue: [''] }
                validation: { required: true }
                itemTemplate: *textItem
    issues:
      - { rule: list-unsatisfiable-limits, topology: replicaSet, field: advanced.blank }

  - name: a default the UI ignores gives no entries to open with
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              wrong:
                uiType: list
                path: spec.args
                fieldParams: { label: Arguments, disableAdd: true, defaultValue: [8080] }
                validation: { required: true }
                itemTemplate: *textItem
    issues:
      - { rule: list-invalid-default, topology: replicaSet, field: advanced.wrong }
      - { rule: list-unsatisfiable-limits, topology: replicaSet, field: advanced.wrong }

  - name: a list that opens with more entries than it allows and lets none be removed can never pass
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              crowded:
                uiType: list
                path: spec.args
                fieldParams: { label: Arguments, disableRemove: true, defaultValue: [--verbose, --quiet] }
                validation: { max: 1 }
                itemTemplate: *textItem
              full:
                uiType: list
                path: spec.argsB
                fieldParams: { label: Arguments, disableRemove: true, defaultValue: [--verbose, --quiet] }
                validation: { max: 2 }
                itemTemplate: *textItem
              open:
                uiType: list
                path: spec.argsC
                fieldParams: { label: Arguments, disableRemove: true, defaultValue: [--verbose, --quiet] }
                itemTemplate: *textItem
    issues:
      - { rule: list-unsatisfiable-limits, topology: replicaSet, field: advanced.crowded }

  - name: a disabled list skips its rules, so its limits block nothing
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              fixed:
                uiType: list
                path: spec.args
                fieldParams: { label: Arguments, disabled: true, disableAdd: true }
                validation: { required: true }
                itemTemplate: *textItem
              crowded:
                uiType: list
                path: spec.argsB
                fieldParams: { label: Arguments, disabled: true, disableRemove: true, defaultValue: [--verbose, --quiet] }
                validation: { max: 1 }
                itemTemplate: *textItem
    issues: []

  - name: an edit and a restore open with a saved instance, which may hold the entries needed
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              saved:
                uiType: list
                path: spec.args
                fieldParams:
                  label: Arguments
                  modes: { edit: { disableAdd: true }, restore: { disableAdd: true } }
                validation: { required: true }
                itemTemplate: *textItem
              kept:
                uiType: list
                path: spec.argsB
                fieldParams:
                  label: Arguments
                  defaultValue: [--verbose, --quiet]
                  modes: { edit: { disableRemove: true }, restore: { disableRemove: true } }
                validation: { max: 1 }
                itemTemplate: *textItem
    issues: []

  - name: an import starts from the default, like a new instance
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              imported:
                uiType: list
                path: spec.args
                fieldParams:
                  label: Arguments
                  modes: { import: { disableAdd: true } }
                validation: { required: true }
                itemTemplate: *textItem
              created:
                uiType: list
                path: spec.argsB
                fieldParams:
                  label: Arguments
                  defaultValue: [--verbose, --quiet]
                  modes: { new: { disableRemove: true } }
                validation: { modes: { new: { max: 1 } } }
                itemTemplate: *textItem
    issues:
      - { rule: list-unsatisfiable-limits, topology: replicaSet, field: advanced.created }
      - { rule: list-unsatisfiable-limits, topology: replicaSet, field: advanced.imported }

  - name: a form mode is judged by the params, the default and the rules it applies
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              filled:
                uiType: list
                path: spec.args
                fieldParams:
                  label: Arguments
                  disableAdd: true
                  modes: { new: { defaultValue: [--verbose] }, import: { defaultValue: [--verbose] } }
                validation: { required: true }
                itemTemplate: *textItem
              optional:
                uiType: list
                path: spec.argsB
                fieldParams: { label: Arguments, disableAdd: true }
                validation:
                  required: true
                  min: 2
                  modes:
                    new: { inheritShared: false }
                    import: { required: false, min: 0 }
                itemTemplate: *textItem
              off:
                uiType: list
                path: spec.argsC
                fieldParams:
                  label: Arguments
                  disableAdd: true
                  modes: { new: { disabled: true }, import: { disableAdd: false } }
                validation: { required: true }
                itemTemplate: *textItem
              half:
                uiType: list
                path: spec.argsD
                fieldParams:
                  label: Arguments
                  disableAdd: true
                  modes: { new: { disabled: true } }
                validation: { required: true }
                itemTemplate: *textItem
    issues:
      - { rule: list-unsatisfiable-limits, topology: replicaSet, field: advanced.half }

  - name: a list hidden in a form mode has no rules to meet there
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              hidden:
                uiType: list
                path: spec.args
                modes: { new: { uiType: hidden }, import: { uiType: hidden } }
                fieldParams: { label: Arguments, disableAdd: true }
                validation: { required: true }
                itemTemplate: *textItem
    issues: []

  - name: a limit that is not a count asks for no entries
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              odd:
                uiType: list
                path: spec.args
                fieldParams: { label: Arguments, disableAdd: true, disableRemove: true, defaultValue: [--verbose, --quiet] }
                validation: { min: 3.5, max: -1 }
                itemTemplate: *textItem
    issues:
      - { rule: list-invalid-limits, topology: replicaSet, field: advanced.odd }

  - name: a list in a toggleable group can never pass once the group is on, so the group could not be used
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              extras:
                uiType: group
                groupType: toggleable
                components:
                  needed:
                    uiType: list
                    path: spec.args
                    fieldParams: { label: Arguments, disableAdd: true }
                    validation: { required: true }
                    itemTemplate: *textItem
    issues:
      - { rule: list-unsatisfiable-limits, topology: replicaSet, field: advanced.extras.needed }

  - name: every finding on one list is reported, in a fixed order
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              args:
                uiType: list
                path: spec.args
                fieldParams:
                  label: Arguments
                  defaultValue: --verbose
                  disableAdd: true
                validation: { regex: { pattern: '^-' }, min: 2, max: 1 }
                itemTemplate: *textItem
    issues:
      - { rule: list-ignored-option, topology: replicaSet, field: advanced.args }
      - { rule: list-invalid-default, topology: replicaSet, field: advanced.args }
      - { rule: list-invalid-limits, topology: replicaSet, field: advanced.args }
      - { rule: list-unsatisfiable-limits, topology: replicaSet, field: advanced.args }

  - name: a list the UI drops isn't linted
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              users:
                uiType: list
                path: spec.users
                fieldParams: { label: Users, defaultValue: { admin: 1 } }
                validation: { regex: { pattern: '^a' } }
                itemTemplate: { uiType: group, components: {} }
    issues:
      - { rule: list-unsupported, topology: replicaSet, field: advanced.users }
