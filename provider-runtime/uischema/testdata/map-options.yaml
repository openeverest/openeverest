# Shared contract for what a rendered map field ignores or can't use.
# `*keyValueRow` repeats the row the second case declares.
# Go: provider-runtime/uischema (Validate) reports `issues`.
# UI: preprocessSchema renders the field anyway and ignores the part it can't
#     use; lintRowsFields reports the same rules, as a dev-time warning.
cases:
  - name: a map with the options it supports has no issue
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              labels:
                uiType: map
                path: spec.labels
                fieldParams:
                  label: Labels
                  defaultValue: { team: db }
                  modes: { edit: { defaultValue: {} } }
                validation:
                  required: true
                  min: 1
                  max: 5
                  celExpressions:
                    - { celExpr: "!has(spec.labels) || 'team' in spec.labels", message: Set a team }
                  modes:
                    edit:
                      max: 10
                      celExpressions:
                        - { celExpr: "!has(original.spec.labels) || has(spec.labels)", message: Keep an entry }
                itemTemplate:
                  uiType: group
                  groupType: line
                  components:
                    key:
                      uiType: text
                      path: key
                      fieldParams:
                        placeholder: team
                        modes: { edit: { disabled: true } }
                      validation:
                        regex: { pattern: '^[a-z]+$', message: Lowercase }
                    value:
                      uiType: text
                      path: value
                      fieldParams: { type: password }
                      validation: { max: 63, modes: { edit: { max: 253 } } }
    issues: []

  - name: regex on the map is ignored, in a mode branch too
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              labels:
                uiType: map
                path: spec.labels
                fieldParams: { label: Labels }
                validation:
                  modes:
                    edit:
                      regex: { pattern: '^a', message: A }
                itemTemplate: &keyValueRow
                  uiType: group
                  groupType: line
                  components:
                    key: { uiType: text, path: key }
                    value: { uiType: text, path: value }
    issues:
      - { rule: map-ignored-option, topology: replicaSet, field: advanced.labels }

  - name: CEL, a default and a badge on a row's field are not supported yet
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              labels:
                uiType: map
                path: spec.labels
                fieldParams: { label: Labels }
                itemTemplate:
                  uiType: group
                  groupType: line
                  components:
                    key:
                      uiType: text
                      path: key
                      validation:
                        celExpressions: [{ celExpr: "self != ''", message: Set }]
                    value:
                      uiType: text
                      path: value
                      fieldParams: { defaultValue: db, badge: Gi }
    issues:
      - { rule: map-ignored-option, topology: replicaSet, field: advanced.labels }

  - name: a row field's default or CEL in a mode is not supported yet either
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              labels:
                uiType: map
                path: spec.labels
                fieldParams: { label: Labels }
                itemTemplate:
                  uiType: group
                  groupType: line
                  components:
                    key: { uiType: text, path: key }
                    value:
                      uiType: text
                      path: value
                      fieldParams:
                        modes: { new: { defaultValue: db } }
              tags:
                uiType: map
                path: spec.tags
                fieldParams: { label: Tags }
                itemTemplate:
                  uiType: group
                  groupType: line
                  components:
                    key:
                      uiType: text
                      path: key
                      validation:
                        modes:
                          edit:
                            celExpressions: [{ celExpr: "self != ''", message: Set }]
                    value: { uiType: text, path: value }
    issues:
      - { rule: map-ignored-option, topology: replicaSet, field: advanced.labels }
      - { rule: map-ignored-option, topology: replicaSet, field: advanced.tags }

  - name: a badge on a row's field is not supported, nor is sending it
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              sizes:
                uiType: map
                path: spec.sizes
                fieldParams: { label: Sizes }
                itemTemplate:
                  uiType: group
                  groupType: line
                  components:
                    key: { uiType: text, path: key }
                    value: { uiType: text, path: value, fieldParams: { badge: Gi } }
              limits:
                uiType: map
                path: spec.limits
                fieldParams: { label: Limits }
                itemTemplate:
                  uiType: group
                  groupType: line
                  components:
                    key: { uiType: text, path: key }
                    value: { uiType: text, path: value, fieldParams: { badgeToApi: true } }
    issues:
      - { rule: map-ignored-option, topology: replicaSet, field: advanced.limits }
      - { rule: map-ignored-option, topology: replicaSet, field: advanced.sizes }

  - name: a row's field is the same in every form mode, so it can't be hidden in one
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              labels:
                uiType: map
                path: spec.labels
                fieldParams: { label: Labels }
                itemTemplate:
                  uiType: group
                  groupType: line
                  components:
                    key: { uiType: text, path: key }
                    value:
                      uiType: text
                      path: value
                      modes: { edit: { uiType: hidden } }
    issues:
      - { rule: map-ignored-option, topology: replicaSet, field: advanced.labels }

  - name: a row field takes no options from an API yet
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              secrets:
                uiType: map
                path: spec.secrets
                fieldParams: { label: Secrets }
                itemTemplate:
                  uiType: group
                  groupType: line
                  components:
                    key: { uiType: text, path: key }
                    value:
                      uiType: text
                      path: value
                      dataSource: { provider: secrets }
    issues:
      - { rule: map-ignored-option, topology: replicaSet, field: advanced.secrets }

  - name: a default that is not a map of strings is ignored
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              weights:
                uiType: map
                path: spec.weights
                fieldParams:
                  label: Weights
                  defaultValue: { primary: 3 }
                itemTemplate: *keyValueRow
    issues:
      - { rule: map-invalid-default, topology: replicaSet, field: advanced.weights }

  - name: a mode's default that is not a map of strings is ignored too
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              labels:
                uiType: map
                path: spec.labels
                fieldParams:
                  label: Labels
                  modes: { new: { defaultValue: [team] } }
                itemTemplate: *keyValueRow
    issues:
      - { rule: map-invalid-default, topology: replicaSet, field: advanced.labels }

  - name: min above max lets no map pass
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              labels:
                uiType: map
                path: spec.labels
                fieldParams: { label: Labels }
                validation: { min: 3, max: 2 }
                itemTemplate: *keyValueRow
    issues:
      - { rule: map-invalid-limits, topology: replicaSet, field: advanced.labels }

  - name: a limit must be a whole number of 0 or more
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              labels:
                uiType: map
                path: spec.labels
                fieldParams: { label: Labels }
                validation: { max: 1.5 }
                itemTemplate: *keyValueRow
              tags:
                uiType: map
                path: spec.tags
                fieldParams: { label: Tags }
                validation: { min: -1 }
                itemTemplate: *keyValueRow
    issues:
      - { rule: map-invalid-limits, topology: replicaSet, field: advanced.labels }
      - { rule: map-invalid-limits, topology: replicaSet, field: advanced.tags }

  - name: a mode branch takes the shared limits, so they can clash with its own
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              labels:
                uiType: map
                path: spec.labels
                fieldParams: { label: Labels }
                validation:
                  max: 1
                  modes: { edit: { min: 2 } }
                itemTemplate: *keyValueRow
    issues:
      - { rule: map-invalid-limits, topology: replicaSet, field: advanced.labels }

  - name: a mode branch that doesn't inherit the shared limits doesn't clash with them
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              labels:
                uiType: map
                path: spec.labels
                fieldParams: { label: Labels }
                validation:
                  max: 1
                  modes: { edit: { inheritShared: false, min: 2 } }
                itemTemplate: *keyValueRow
    issues: []

  - name: every finding on one map is reported, in a fixed order
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              labels:
                uiType: map
                path: spec.labels
                fieldParams:
                  label: Labels
                  defaultValue: team
                validation: { regex: { pattern: '^a' }, min: 2, max: 1 }
                itemTemplate: *keyValueRow
    issues:
      - { rule: map-ignored-option, topology: replicaSet, field: advanced.labels }
      - { rule: map-invalid-default, topology: replicaSet, field: advanced.labels }
      - { rule: map-invalid-limits, topology: replicaSet, field: advanced.labels }

  - name: a map the UI drops isn't linted
    uiSchema:
      replicaSet:
        sections:
          advanced:
            components:
              users:
                uiType: map
                path: spec.users
                fieldParams: { label: Users, defaultValue: { admin: 1 } }
                validation: { regex: { pattern: '^a' } }
                itemTemplate: { uiType: group, components: {} }
    issues:
      - { rule: map-unsupported, topology: replicaSet, field: advanced.users }
