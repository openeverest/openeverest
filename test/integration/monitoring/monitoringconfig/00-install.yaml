apiVersion: kuttl.dev/v1
kind: TestStep
timeout: 10
commands:
---
apiVersion: core.openeverest.io/v1alpha1
kind: Provider
metadata:
  name: test-provider
  labels:
    app.kubernetes.io/managed-by: openeverest
spec:
  componentTypes:
    pmm:
      versions:
        - default: true
          image: percona/pmm-client:2.44.1
          version: 2.44.1
  components:
    monitoring:
      type: pmm

  topologies:
    replicaSet:
      components:
        monitoring:
          optional: true
  uiSchema:
---
apiVersion: v1
kind: Secret
metadata:
  name: mc-test-secret
type: Opaque
data:
  apiKey: YWJjZGVm
---
apiVersion: monitoring.openeverest.io/v1alpha2
kind: MonitoringConfig
metadata:
  name: mc-test
spec:
  type: pmm
  credentialsSecretName: mc-test-secret
  verifyTLS: false
  url: http://localhost-mc-test
