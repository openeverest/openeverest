# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: backupstorageclass-api-validation
spec:
  steps:
  - name: builtin-s3-class
    try:
    - assert:
        resource:
          apiVersion: backup.openeverest.io/v1alpha1
          kind: BackupStorageClass
          metadata:
            name: s3
          spec:
            authModes:
            - name: AccessKey
              credentials:
                required:
                - AWS_ACCESS_KEY_ID
                - AWS_SECRET_ACCESS_KEY
            parametersSchema:
              openAPIV3Schema:
                required:
                - endpointURL
                - region
            (length(validations)): 3
            (validations[0].reason): InvalidLocation
            (validations[1].reason): InvalidParameters
            (validations[2].reason): InvalidParameters
  - name: auth-modes
    try:
    - script:
        content: |
          kubectl create --dry-run=server -f - <<'YAML'
          apiVersion: backup.openeverest.io/v1alpha1
          kind: BackupStorageClass
          metadata:
            name: bsc-api-no-modes.test.openeverest.io
          spec: {}
          YAML
        check:
          ($error != null): true
          "(contains($stderr, 'spec.authModes: Required value'))": true
    - script:
        content: |
          kubectl create --dry-run=server -f - <<'YAML'
          apiVersion: backup.openeverest.io/v1alpha1
          kind: BackupStorageClass
          metadata:
            name: bsc-api-reserved-with-keys.test.openeverest.io
          spec:
            authModes:
            - name: WorkloadIdentity
              credentials:
                required: [token]
          YAML
        check:
          ($error != null): true
          (contains($stderr, 'WorkloadIdentity and Anonymous take no credentials')): true
    - script:
        content: |
          kubectl create --dry-run=server -f - <<'YAML'
          apiVersion: backup.openeverest.io/v1alpha1
          kind: BackupStorageClass
          metadata:
            name: bsc-api-mode-without-keys.test.openeverest.io
          spec:
            authModes:
            - name: AccountKey
          YAML
        check:
          ($error != null): true
          (contains($stderr, 'every other mode must declare its credentials keys')): true
    - script:
        content: |
          kubectl create --dry-run=server -f - <<'YAML'
          apiVersion: backup.openeverest.io/v1alpha1
          kind: BackupStorageClass
          metadata:
            name: bsc-api-mode-name.test.openeverest.io
          spec:
            authModes:
            - name: access-key
              credentials:
                required: [key]
          YAML
        check:
          ($error != null): true
          "(contains($stderr, 'spec.authModes[0].name in body should match'))": true
    - script:
        content: |
          kubectl create --dry-run=server -f - <<'YAML'
          apiVersion: backup.openeverest.io/v1alpha1
          kind: BackupStorageClass
          metadata:
            name: bsc-api-duplicate-mode.test.openeverest.io
          spec:
            authModes:
            - name: AccountKey
              credentials:
                required: [key]
            - name: AccountKey
              credentials:
                required: [other]
          YAML
        check:
          ($error != null): true
          (contains($stderr, 'Duplicate value')): true
    - script:
        content: |
          kubectl create --dry-run=server -f - <<'YAML'
          apiVersion: backup.openeverest.io/v1alpha1
          kind: BackupStorageClass
          metadata:
            name: bsc-api-valid.test.openeverest.io
          spec:
            displayName: Example
            authModes:
            - name: WorkloadIdentity
            - name: AccountKey
              credentials:
                required: [key]
                optional: [account]
          YAML
        check:
          ($error): ~
  - name: name-length
    try:
    # A credentials Secret names its class in a label value, at most 63 characters.
    - script:
        content: |
          kubectl create --dry-run=server -f - <<'YAML'
          apiVersion: backup.openeverest.io/v1alpha1
          kind: BackupStorageClass
          metadata:
            name: bsc-api-name-length-xxxxxxxxxxxxxxxxxxxxxxxx.test.openeverest.io
          spec:
            authModes:
            - name: AccessKey
              credentials:
                required: [key]
          YAML
        check:
          ($error != null): true
          (contains($stderr, 'a BackupStorageClass name must be at most 63 characters')): true
    - script:
        content: |
          kubectl create --dry-run=server -f - <<'YAML'
          apiVersion: backup.openeverest.io/v1alpha1
          kind: BackupStorageClass
          metadata:
            name: bsc-api-name-length-xxxxxxxxxxxxxxxxxxxxxxx.test.openeverest.io
          spec:
            authModes:
            - name: AccessKey
              credentials:
                required: [key]
          YAML
        check:
          ($error): ~
  - name: validations
    try:
    - script:
        content: |
          kubectl create --dry-run=server -f - <<'YAML'
          apiVersion: backup.openeverest.io/v1alpha1
          kind: BackupStorageClass
          metadata:
            name: bsc-api-validations.test.openeverest.io
          spec:
            authModes:
            - name: AccountKey
              credentials:
                required: [key]
            validations:
            - expression: self.location.objectStore.bucket.size() <= 24
              message: a container name is at most 24 characters
              reason: InvalidLocation
            - expression: "!has(self.tls) || !self.tls.insecureSkipVerify"
              message: TLS verification cannot be turned off
              reason: InvalidParameters
          YAML
        check:
          ($error): ~
    - script:
        content: |
          kubectl create --dry-run=server -f - <<'YAML'
          apiVersion: backup.openeverest.io/v1alpha1
          kind: BackupStorageClass
          metadata:
            name: bsc-api-validation-reason.test.openeverest.io
          spec:
            authModes:
            - name: AccountKey
              credentials:
                required: [key]
            validations:
            - expression: "true"
              message: never
              reason: CredentialsNotFound
          YAML
        check:
          ($error != null): true
          (contains($stderr, 'the reason of a validation must be InvalidLocation or InvalidParameters')): true
    - script:
        content: |
          kubectl create --dry-run=server -f - <<'YAML'
          apiVersion: backup.openeverest.io/v1alpha1
          kind: BackupStorageClass
          metadata:
            name: bsc-api-validation-message.test.openeverest.io
          spec:
            authModes:
            - name: AccountKey
              credentials:
                required: [key]
            validations:
            - expression: "true"
              reason: InvalidParameters
          YAML
        check:
          ($error != null): true
          "(contains($stderr, 'spec.validations[0].message: Required value'))": true
