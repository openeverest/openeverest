# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: backupstorage
spec:
  description: |
    Test BackupStorage: Accepted against the built-in s3 BackupStorageClass,
    status.backupClasses, admission rules, immutability and the in-use
    protection finalizer.
  timeouts:
    apply: 10s
    assert: 30s
    delete: 30s
  steps:
    - name: create-provider-and-backupclasses
      try:
        - apply:
            resource:
              apiVersion: core.openeverest.io/v1alpha1
              kind: Provider
              metadata:
                name: test-provider
                labels:
                  app.kubernetes.io/managed-by: openeverest
              spec:
                componentTypes:
                  engine:
                    defaultVersion: 1.0.0
                    versions:
                      - image: fake/fake:1.0.0
                        version: 1.0.0
                  backupAgent:
                    defaultVersion: 1.0.0
                    versions:
                      - image: fake/fake:1.0.0
                        version: 1.0.0
                components:
                  engine:
                    type: engine
                topologies:
                  replicaSet:
                    components:
                      engine:
                        optional: false
                uiSchema:
        - apply:
            resource:
              apiVersion: backup.openeverest.io/v1alpha1
              kind: BackupClass
              metadata:
                name: bs-test-accesskey
              spec:
                executionMode: ProviderManaged
                supportedProviders:
                  - test-provider
                backupStorageClasses:
                  - name: s3
                    authModes: [AccessKey]
        - apply:
            resource:
              apiVersion: backup.openeverest.io/v1alpha1
              kind: BackupClass
              metadata:
                name: bs-test-workload-identity
              spec:
                executionMode: ProviderManaged
                supportedProviders:
                  - test-provider
                backupStorageClasses:
                  - name: s3
                    authModes: [WorkloadIdentity]
      catch:
        - podLogs:
            namespace: openeverest-system
            selector: control-plane=controller-manager
            tail: 100

    - name: create-accepted-backupstorage
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: bs-test-credentials
              type: Opaque
              stringData:
                AWS_ACCESS_KEY_ID: test-access-key
                AWS_SECRET_ACCESS_KEY: test-secret-key
        - apply:
            resource:
              apiVersion: backup.openeverest.io/v1alpha1
              kind: BackupStorage
              metadata:
                name: bs-test
              spec:
                backupStorageClassRef:
                  name: s3
                location:
                  bucket: test-bucket
                  prefix: everest/ci
                parameters:
                  region: us-east-1
                  endpointURL: https://s3.amazonaws.com
                authentication:
                  mode: AccessKey
                  credentialsSecretRef:
                    name: bs-test-credentials
        - assert:
            resource:
              apiVersion: backup.openeverest.io/v1alpha1
              kind: BackupStorage
              metadata:
                name: bs-test
                finalizers:
                  - backupstorage.backup.openeverest.io/in-use-protection
              status:
                "(conditions[?type == 'Accepted'])":
                  - status: "True"
                    reason: Accepted
                "(backupClasses[?name == 'bs-test-accesskey'])":
                  - compatible: true
                "(backupClasses[?name == 'bs-test-workload-identity'])":
                  - compatible: false
                    reason: AuthModeUnsupported
      catch:
        - script:
            content: kubectl get backupstorage/bs-test -n $NAMESPACE -o yaml
        - podLogs:
            namespace: openeverest-system
            selector: control-plane=controller-manager
            tail: 100

    - name: credentials-secret-created-later
      try:
        - apply:
            resource:
              apiVersion: backup.openeverest.io/v1alpha1
              kind: BackupStorage
              metadata:
                name: bs-test-late-secret
              spec:
                backupStorageClassRef:
                  name: s3
                location:
                  bucket: test-bucket
                parameters:
                  region: us-east-1
                  endpointURL: https://s3.amazonaws.com
                authentication:
                  mode: AccessKey
                  credentialsSecretRef:
                    name: bs-test-late-secret-credentials
        - assert:
            resource:
              apiVersion: backup.openeverest.io/v1alpha1
              kind: BackupStorage
              metadata:
                name: bs-test-late-secret
              status:
                "(conditions[?type == 'Accepted'])":
                  - status: "False"
                    reason: CredentialsNotFound
                    (contains(message, 'not found')): true
        # A Secret without a key the AccessKey mode requires is still not enough.
        - apply:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: bs-test-late-secret-credentials
              type: Opaque
              stringData:
                AWS_ACCESS_KEY_ID: test-access-key
        - assert:
            resource:
              apiVersion: backup.openeverest.io/v1alpha1
              kind: BackupStorage
              metadata:
                name: bs-test-late-secret
              status:
                "(conditions[?type == 'Accepted'])":
                  - status: "False"
                    reason: CredentialsNotFound
                    (contains(message, 'AWS_SECRET_ACCESS_KEY')): true
        - apply:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: bs-test-late-secret-credentials
              type: Opaque
              stringData:
                AWS_ACCESS_KEY_ID: test-access-key
                AWS_SECRET_ACCESS_KEY: test-secret-key
        - assert:
            resource:
              apiVersion: backup.openeverest.io/v1alpha1
              kind: BackupStorage
              metadata:
                name: bs-test-late-secret
              status:
                "(conditions[?type == 'Accepted'])":
                  - status: "True"
                    reason: Accepted
      catch:
        - script:
            content: kubectl get backupstorage/bs-test-late-secret -n $NAMESPACE -o yaml
        - podLogs:
            namespace: openeverest-system
            selector: control-plane=controller-manager
            tail: 100

    - name: rejected-by-class
      try:
        - apply:
            resource:
              apiVersion: backup.openeverest.io/v1alpha1
              kind: BackupStorage
              metadata:
                name: bs-test-missing-class
              spec:
                backupStorageClassRef:
                  name: does-not-exist
                location:
                  bucket: test-bucket
                authentication:
                  mode: AccessKey
                  credentialsSecretRef:
                    name: bs-test-credentials
        - apply:
            resource:
              apiVersion: backup.openeverest.io/v1alpha1
              kind: BackupStorage
              metadata:
                name: bs-test-no-region
              spec:
                backupStorageClassRef:
                  name: s3
                location:
                  bucket: test-bucket
                parameters:
                  endpointURL: https://s3.amazonaws.com
                authentication:
                  mode: AccessKey
                  credentialsSecretRef:
                    name: bs-test-credentials
        - assert:
            resource:
              apiVersion: backup.openeverest.io/v1alpha1
              kind: BackupStorage
              metadata:
                name: bs-test-missing-class
              status:
                "(conditions[?type == 'Accepted'])":
                  - status: "False"
                    reason: ClassNotFound
        - assert:
            resource:
              apiVersion: backup.openeverest.io/v1alpha1
              kind: BackupStorage
              metadata:
                name: bs-test-no-region
              status:
                "(conditions[?type == 'Accepted'])":
                  - status: "False"
                    reason: InvalidParameters
                    (contains(message, 'region')): true
      catch:
        - script:
            content: kubectl get backupstorage/bs-test-missing-class backupstorage/bs-test-no-region -n $NAMESPACE -o yaml
        - podLogs:
            namespace: openeverest-system
            selector: control-plane=controller-manager
            tail: 100

    - name: immutable-fields
      try:
        - script:
            content: |
              kubectl patch backupstorage bs-test -n "$NAMESPACE" --type=merge --dry-run=server \
                -p '{"spec":{"location":{"bucket":"other-bucket"}}}'
            check:
              ($error != null): true
              (contains($stderr, 'location is immutable')): true
        - script:
            content: |
              kubectl patch backupstorage bs-test -n "$NAMESPACE" --type=merge --dry-run=server \
                -p '{"spec":{"location":{"prefix":"elsewhere"}}}'
            check:
              ($error != null): true
              (contains($stderr, 'location is immutable')): true
        - script:
            content: |
              kubectl patch backupstorage bs-test -n "$NAMESPACE" --type=merge --dry-run=server \
                -p '{"spec":{"backupStorageClassRef":{"name":"other"}}}'
            check:
              ($error != null): true
              (contains($stderr, 'backupStorageClassRef is immutable')): true
        - script:
            content: |
              kubectl patch backupstorage bs-test -n "$NAMESPACE" --type=merge --dry-run=server \
                -p '{"spec":{"parameters":{"region":"eu-west-1"},"authentication":{"credentialsSecretRef":{"name":"bs-test-late-secret-credentials"}}}}'
            check:
              ($error): ~

    - name: admission
      try:
        - script:
            content: |
              kubectl create -n "$NAMESPACE" --dry-run=server -f - <<'EOF'
              apiVersion: backup.openeverest.io/v1alpha1
              kind: BackupStorage
              metadata:
                name: bs-test-anonymous
              spec:
                backupStorageClassRef: {name: s3}
                location: {bucket: test-bucket}
                parameters: {region: us-east-1, endpointURL: 'https://s3.amazonaws.com'}
                authentication: {mode: Anonymous}
              EOF
            check:
              ($error != null): true
              (contains($stderr, 'a BackupStorage cannot use the Anonymous authentication mode')): true
        - script:
            content: |
              kubectl create -n "$NAMESPACE" --dry-run=server -f - <<'EOF'
              apiVersion: backup.openeverest.io/v1alpha1
              kind: BackupStorage
              metadata:
                name: bs-test-ca-and-skip
              spec:
                backupStorageClassRef: {name: s3}
                location: {bucket: test-bucket}
                parameters: {region: us-east-1, endpointURL: 'https://s3.amazonaws.com'}
                authentication: {mode: AccessKey, credentialsSecretRef: {name: bs-test-credentials}}
                tls:
                  ca: {secretKeyRef: {name: corp-ca, key: ca.crt}}
                  insecureSkipVerify: true
              EOF
            check:
              ($error != null): true
              (contains($stderr, 'ca and insecureSkipVerify are mutually exclusive')): true
        - script:
            content: |
              kubectl create -n "$NAMESPACE" --dry-run=server -f - <<'EOF'
              apiVersion: backup.openeverest.io/v1alpha1
              kind: BackupStorage
              metadata:
                name: bs-test-dotdot-prefix
              spec:
                backupStorageClassRef: {name: s3}
                location: {bucket: test-bucket, prefix: everest/../other}
                parameters: {region: us-east-1, endpointURL: 'https://s3.amazonaws.com'}
                authentication: {mode: AccessKey, credentialsSecretRef: {name: bs-test-credentials}}
              EOF
            check:
              ($error != null): true
              (contains($stderr, 'prefix must not contain')): true
        - script:
            content: |
              kubectl create -n "$NAMESPACE" --dry-run=server -f - <<'EOF'
              apiVersion: backup.openeverest.io/v1alpha1
              kind: BackupStorage
              metadata:
                name: bs-test-no-secret-ref
              spec:
                backupStorageClassRef: {name: s3}
                location: {bucket: test-bucket}
                parameters: {region: us-east-1, endpointURL: 'https://s3.amazonaws.com'}
                authentication: {mode: AccessKey}
              EOF
            check:
              ($error != null): true
              (contains($stderr, 'credentialsSecretRef is required for every mode except WorkloadIdentity and Anonymous, which take none')): true

    - name: create-instance-with-backupstorage
      try:
        - apply:
            resource:
              apiVersion: core.openeverest.io/v1alpha1
              kind: Instance
              metadata:
                name: test-instance-bs
              spec:
                providerRef:
                  name: test-provider
                backup:
                  enabled: true
                  classRef:
                    name: bs-test-accesskey
                  storages:
                    - storageRef:
                        name: bs-test
        - assert:
            resource:
              apiVersion: core.openeverest.io/v1alpha1
              kind: Instance
              metadata:
                name: test-instance-bs
              spec:
                backup:
                  classRef:
                    name: bs-test-accesskey
                  storages:
                    - storageRef:
                        name: bs-test
      catch:
        - script:
            content: kubectl get instance/test-instance-bs -n $NAMESPACE -o yaml
        - podLogs:
            namespace: openeverest-system
            selector: control-plane=controller-manager
            tail: 100

    - name: delete-blocked-by-instance
      try:
        - script:
            content: kubectl delete backupstorage bs-test -n $NAMESPACE --wait=false
        - assert:
            resource:
              apiVersion: backup.openeverest.io/v1alpha1
              kind: BackupStorage
              metadata:
                name: bs-test
                finalizers:
                  - backupstorage.backup.openeverest.io/in-use-protection
                (deletionTimestamp != null): true
              status:
                "(conditions[?type == 'Deleting'])":
                  - status: "True"
                    reason: WaitingForReferrers
                    message: still referenced by 1 Instance(s)
      catch:
        - script:
            content: kubectl get backupstorage/bs-test -n $NAMESPACE -o yaml
        - podLogs:
            namespace: openeverest-system
            selector: control-plane=controller-manager
            tail: 100

    - name: create-backup-with-backupstorage
      try:
        - apply:
            resource:
              apiVersion: backup.openeverest.io/v1alpha1
              kind: Backup
              metadata:
                name: test-backup-bs
              spec:
                origin:
                  type: Instance
                  instanceRef:
                    name: test-instance-bs
                classRef:
                  name: bs-test-accesskey
                storageRef:
                  name: bs-test
        - assert:
            resource:
              apiVersion: backup.openeverest.io/v1alpha1
              kind: BackupStorage
              metadata:
                name: bs-test
                finalizers:
                  - backupstorage.backup.openeverest.io/in-use-protection
                (deletionTimestamp != null): true
              status:
                "(conditions[?type == 'Deleting'])":
                  - status: "True"
                    reason: WaitingForReferrers
                    message: still referenced by 1 Instance(s), 1 Backup(s)
      catch:
        - script:
            content: kubectl get backupstorage/bs-test -n $NAMESPACE -o yaml
        - script:
            content: kubectl get backup/test-backup-bs -n $NAMESPACE -o yaml
        - podLogs:
            namespace: openeverest-system
            selector: control-plane=controller-manager
            tail: 100

    - name: delete-instance
      try:
        - script:
            content: kubectl delete instance test-instance-bs -n $NAMESPACE --wait=false
        - assert:
            resource:
              apiVersion: backup.openeverest.io/v1alpha1
              kind: BackupStorage
              metadata:
                name: bs-test
                finalizers:
                  - backupstorage.backup.openeverest.io/in-use-protection
                (deletionTimestamp != null): true
              status:
                "(conditions[?type == 'Deleting'])":
                  - status: "True"
                    reason: WaitingForReferrers
                    message: still referenced by 1 Backup(s)
      catch:
        - script:
            content: kubectl get backupstorage/bs-test -n $NAMESPACE -o yaml
        - script:
            content: kubectl get instance/test-instance-bs -n $NAMESPACE -o yaml
        - podLogs:
            namespace: openeverest-system
            selector: control-plane=controller-manager
            tail: 100

    - name: delete-backup-releases-backupstorage
      try:
        - script:
            content: kubectl delete backup test-backup-bs -n $NAMESPACE --wait=false
        - error:
            resource:
              apiVersion: backup.openeverest.io/v1alpha1
              kind: BackupStorage
              metadata:
                name: bs-test
      catch:
        - script:
            content: kubectl get backupstorage/bs-test -n $NAMESPACE -o yaml
        - script:
            content: kubectl get backup/test-backup-bs -n $NAMESPACE -o yaml
        - podLogs:
            namespace: openeverest-system
            selector: control-plane=controller-manager
            tail: 100
