apiVersion: v1
kind: Namespace
metadata:
  name: core-e2e-provider
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: core-e2e-test-provider
  namespace: core-e2e-provider
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: core-e2e-test-provider
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["core.openeverest.io"]
    resources: ["instances"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["core.openeverest.io"]
    resources: ["instances/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["core.openeverest.io"]
    resources: ["instances/finalizers"]
    verbs: ["update"]
  - apiGroups: ["core.openeverest.io"]
    resources: ["providers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["backup.openeverest.io"]
    resources: ["backups", "restores"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["backup.openeverest.io"]
    resources: ["backups/status", "restores/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["backup.openeverest.io"]
    resources: ["backups/finalizers", "restores/finalizers"]
    verbs: ["update"]
  - apiGroups: ["backup.openeverest.io"]
    resources: ["backupstorages", "backupclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: core-e2e-test-provider
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: core-e2e-test-provider
subjects:
  - kind: ServiceAccount
    name: core-e2e-test-provider
    namespace: core-e2e-provider
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-e2e-test-provider
  namespace: core-e2e-provider
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: core-e2e-test-provider
  template:
    metadata:
      labels:
        app.kubernetes.io/name: core-e2e-test-provider
    spec:
      serviceAccountName: core-e2e-test-provider
      containers:
        - name: provider
          image: core-e2e-test-provider:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8082
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: core-e2e-test-provider
  namespace: core-e2e-provider
spec:
  selector:
    app.kubernetes.io/name: core-e2e-test-provider
  ports:
    - name: http
      port: 8082
      targetPort: http
---
apiVersion: core.openeverest.io/v1alpha1
kind: Provider
metadata:
  name: core-e2e-test
spec:
  componentTypes:
    test:
      defaultVersion: "1.0.0"
      versions:
        - version: "1.0.0"
          image: registry.k8s.io/pause:3.10
  components:
    engine:
      type: test
  topologies:
    standalone:
      components:
        engine: {}
  defaultVersion: "1.0.0"
  versions:
    - name: "1.0.0"
      components:
        engine: "1.0.0"
---
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupClass
metadata:
  name: core-e2e-test
spec:
  displayName: Core e2e test
  supportedProviders: ["core-e2e-test"]
  executionMode: ProviderManaged
  providerManaged:
    supportsPITR: true
