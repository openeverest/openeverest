# One MonitoringDestination per class in the my-special-place namespace of
# dev/config.yaml.example. Core sets Accepted (class found, parameters valid,
# credentials present); the class controller sets Ready once it reached the
# backend.
apiVersion: v1
kind: Secret
metadata:
  name: pmm-dev-credentials
  namespace: my-special-place
type: Opaque
stringData:
  # A PMM 3 service account token.
  apiKey: replace-with-a-pmm-service-account-token
---
apiVersion: monitoring.openeverest.io/v1alpha1
kind: MonitoringDestination
metadata:
  name: pmm-dev
  namespace: my-special-place
spec:
  classRef: {name: pmm}
  credentialsSecretRef: {name: pmm-dev-credentials}
  parameters:
    url: https://monitoring-service.pmm.svc.cluster.local
    verifyTLS: false
---
apiVersion: monitoring.openeverest.io/v1alpha1
kind: MonitoringDestination
metadata:
  name: prometheus-dev
  namespace: my-special-place
spec:
  classRef: {name: prometheus}
  parameters:
    podMonitorLabels: {release: kube-prometheus-stack}
    interval: 30s
---
apiVersion: monitoring.openeverest.io/v1alpha1
kind: MonitoringDestination
metadata:
  name: victoriametrics-dev
  namespace: my-special-place
spec:
  classRef: {name: victoriametrics}
  parameters:
    vmPodScrapeLabels: {app.kubernetes.io/instance: vmagent}
    interval: 30s
