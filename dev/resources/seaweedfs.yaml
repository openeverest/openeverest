apiVersion: v1
kind: Namespace
metadata:
  name: seaweedfs
  labels:
    name: seaweedfs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
  namespace: seaweedfs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: seaweedfs
  name: seaweedfs
  namespace: seaweedfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.47
          args:
            - mini
            - -dir=/data
            - -s3.cert.file=/etc/seaweedfs/certs/public.crt
            - -s3.key.file=/etc/seaweedfs/certs/private.key
            - -webdav=false
            - -admin.ui=false
            - -s3.port.iceberg=0
            - -s3.port.lance=0
            - -master.telemetry=false
          env:
            - name: S3_BUCKET
              value: "bucket-1,bucket-2,bucket-3,bucket-4,bucket-5,bucket-6"
            - name: AWS_ACCESS_KEY_ID
              value: seaweedfsadmin
            - name: AWS_SECRET_ACCESS_KEY
              value: seaweedfsadmin
          ports:
            - name: s3
              containerPort: 8333
          readinessProbe:
            httpGet:
              path: /healthz
              port: s3
              scheme: HTTPS
          volumeMounts:
            - mountPath: /data
              name: seaweedfs-data-vol
            - mountPath: /etc/seaweedfs/certs
              name: seaweedfs-cert
              readOnly: true
      volumes:
        - name: seaweedfs-data-vol
          persistentVolumeClaim:
            claimName: seaweedfs-data
        - name: seaweedfs-cert
          secret:
            secretName: seaweedfs-cert
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: seaweedfs
spec:
  type: ClusterIP
  selector:
    app: seaweedfs
  ports:
    - protocol: TCP
      port: 443
      targetPort: s3
---
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-cert
  namespace: seaweedfs
type: Opaque
data:
  private.key: 
  public.crt: 
