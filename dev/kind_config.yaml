---
# kind cluster for CI. Local development uses k3d instead (see k3d_config.yaml);
# CI uses kind because it runs cleanly on containerized (ARC) runners where
# k3d's flannel bridge networking does not.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: everest-server-test
# Pin the Kubernetes version under test; a floating default would change
# silently whenever the kind binary is bumped.
nodes:
  - role: control-plane
    image: &node kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
  - role: worker
    image: *node
    # Pairs with `make expose` (NodePort 30080): the Everest API is reachable
    # on http://localhost:8080, same as the k3d port mapping.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
  - role: worker
    image: *node
  - role: worker
    image: *node
