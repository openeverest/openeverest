---
# See more details at https://k3d.io/v5.3.0/usage/configfile/
# Enables LoadBalancer in k3d.
# Only one LoadBalancer service (one engine instance) can be used at a time,
# due how ports are mapped from the host to k3d cluster.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: everest-loadbalancer-test
servers: 1 # number of control-plane nodes in the cluster
agents: 3 # number of worker nodes in the cluster
image: rancher/k3s:v1.35.4-k3s1 # image to use for the cluster nodes; list of supported images: https://hub.docker.com/r/rancher/k3s/tags
registries: # define how registries should be created or used
  create: # creates a default registry to be used with the cluster; same as `--registry-create k3d-registry`
    name: k3d-registry
    host: "0.0.0.0"
    hostPort: "5000"
ports:
  - port: 8080:30080 # Everest UI will be accessible via http://localhost:8080 on the host machine
    nodeFilters:
      - agent:0:direct
  - port: 27017:27017 # MongoDB default port
    nodeFilters:
      - agent:0:direct
  - port: 5432:5432 # PostgreSQL default port
    nodeFilters:
      - agent:0:direct
  - port: 3306:3306 # MySQL default port
    nodeFilters:
      - agent:0:direct
options:
  k3d: # k3d runtime settings
    wait: true # wait for cluster to be usable before returining;
  k3s: # options passed on to K3s itself
    extraArgs:
      - arg: "--disable=traefik,metrics-server"
        nodeFilters:
          - server:*
      - arg: "--disable-network-policy"
        nodeFilters:
          - server:*
