apiVersion: backup.openeverest.io/v1alpha1
kind: BackupClass
metadata:
  name: test-backup-class
spec:
  displayName: Test Backup Class
  executionMode: ProviderManaged
  providerManaged:
    providerRef:
      name: test-provider
  supportsImport: true
  backupStorageClasses:
    - name: s3
      authModes: [AccessKey]
      # The api-tests storages verify TLS against nothing (insecureSkipVerify).
      tls:
        customCA: Supported
        insecureSkipVerify: Supported
