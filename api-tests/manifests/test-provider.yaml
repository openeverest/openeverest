# Basic test provider for instance preset testing
apiVersion: core.openeverest.io/v1alpha1
kind: Provider
metadata:
  name: test-provider
spec:
  componentTypes:
    enginex:
      defaultVersion: "1.0.0"
      versions:
        - version: "1.0.0"
          image: "test/engine:1.0.0"
  components:
    engine:
      type: enginex
  topologies:
    standalone:
      components:
        engine:
  defaultVersion: "1.0.0"
  versions:
    - name: "1.0.0"
      components:
        enginex: "1.0.0"
  secrets:
    test-credentials:
      parametersSchema:
        openAPIV3Schema:
          type: object
          properties:
            accessKey:
              type: string
            secretKey:
              type: string
  configMaps:
    test-config:
      parametersSchema:
        openAPIV3Schema:
          type: object
          properties:
            endpoint:
              type: string
            timeout:
              type: string
          required:
            - endpoint
