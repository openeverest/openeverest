---
version: 2
updates:
  # ============================================================================
  # v1: main branch (stable)
  # ============================================================================

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "go"
    target-branch: "main"
  - package-ecosystem: "gomod"
    directory: "/tools"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "go"
    target-branch: "main"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    target-branch: "main"
  - package-ecosystem: "docker"
    directory: "/dev"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    target-branch: "main"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github_actions"
    target-branch: "main"
  - package-ecosystem: "npm"
    directory: "/api-tests"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "javascript"
    target-branch: "main"
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "javascript"
    target-branch: "main"
  - package-ecosystem: "npm"
    directory: "/cli-tests"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "javascript"
    target-branch: "main"
  # ============================================================================
  # v2: release-2.0 branch (next major version)
  # ============================================================================

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "go"
    target-branch: "release-2.0"
  - package-ecosystem: "gomod"
    directory: "/tools"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "go"
    target-branch: "release-2.0"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    target-branch: "release-2.0"
  - package-ecosystem: "docker"
    directory: "/dev"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    target-branch: "release-2.0"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github_actions"
    target-branch: "release-2.0"
  - package-ecosystem: "npm"
    directory: "/api-tests"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "javascript"
    target-branch: "release-2.0"
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "javascript"
    target-branch: "release-2.0"
  - package-ecosystem: "npm"
    directory: "/cli-tests"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "javascript"
    target-branch: "release-2.0"
