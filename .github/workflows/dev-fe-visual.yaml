---
name: FE Visual Screenshots
on:
  workflow_dispatch:
    inputs:
      update_baselines:
        description: "Regenerate baseline screenshots instead of comparing against committed ones"
        type: boolean
        default: false
  push:
    branches:
      - "mui-update-*"
      - "copilot/mui-update-*"
    paths:
      - "ui/**"
      - ".github/workflows/dev-fe-visual.yaml"

permissions:
  contents: read

jobs:
  visual-screenshots:
    name: Generate Visual Screenshots
    runs-on: ubuntu-latest
    steps:
      # The visual suite is fully hermetic: every /v1 request (data, platform
      # and auth) is mocked at the network layer, so NO Kubernetes cluster or
      # Everest backend is needed — only the built UI served by Vite.
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: true
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 9.4.0

      - name: Use Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.x
          cache: "pnpm"
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Build UI and start the dev server
        shell: bash
        run: |
          cd ui
          make init
          make build
          pnpm --filter "@percona/everest" dev &
          # Wait for the Vite dev server to serve the SPA. No backend is needed:
          # the visual suite intercepts every /v1 call before it leaves the page.
          timeout 120 bash -c 'until curl -sf http://localhost:3000 >/dev/null; do sleep 2; done'

      - name: Install Chromium for Playwright
        shell: bash
        run: |
          cd ui/apps/everest
          npx playwright install --with-deps chromium

      - name: Run visual screenshot tests
        shell: bash
        env:
          EVEREST_URL: "http://localhost:3000"
        run: |
          cd ui
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.update_baselines }}" = "true" ]; then
            echo "Regenerating baseline screenshots (update mode)"
            pnpm --filter "@percona/everest" e2e:visual:update
          else
            echo "Comparing against committed baseline screenshots"
            pnpm --filter "@percona/everest" e2e:visual
          fi

      - name: Upload regenerated baselines
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_baselines }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-baselines
          path: ui/apps/everest/.e2e/pr/visual/visual-baseline.e2e.ts-snapshots/
          if-no-files-found: error
          overwrite: true

      - name: Archive playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-visual
          path: ui/apps/everest/.e2e/playwright-report/
          overwrite: true

      - name: Archive test results (traces, diffs, error context)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-test-results
          path: ui/apps/everest/.e2e/test-results/
          if-no-files-found: ignore
          overwrite: true
