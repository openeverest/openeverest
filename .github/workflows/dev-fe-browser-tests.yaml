---
name: FE Browser Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: cncf-ubuntu-8-32-x86
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('ui/pnpm-lock.yaml') }}

      - name: Install Chromium for browser mode
        working-directory: ui/apps/everest
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Vitest browser project
        working-directory: ui/apps/everest
        env:
          CI: true
        run: pnpm test:browser:ci

      - name: Upload browser test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vitest-browser-reports
          path: ui/apps/everest/test-results/
          if-no-files-found: ignore
          overwrite: true
