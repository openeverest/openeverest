---
name: FE Browser Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tests:
    timeout-minutes: 30
    runs-on: cncf-ubuntu-8-32-x86
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('ui/pnpm-lock.yaml') }}

      - name: Install Chromium for browser mode
        working-directory: ui/apps/everest
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Vitest browser project
        working-directory: ui/apps/everest
        env:
          CI: true
        run: pnpm test:browser:ci

      - name: Upload browser test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-browser-reports
          path: ui/apps/everest/test-results/
          if-no-files-found: ignore
          overwrite: true
