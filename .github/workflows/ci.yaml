---
# Single PR CI pipeline.
#
# Design:
# - One workflow, no workflow-level path filters: every PR produces the same set
#   of check contexts, so required checks never hang in "Expected".
# - The `changes` job classifies the diff once; backend/frontend jobs skip via
#   `if:` when their area is untouched. Skipped jobs count as passing.
# - `CI OK` aggregates every job result and is the single check that branch
#   protection requires. No polling gatekeepers: GitHub's `needs` graph replaces
#   upsidr/merge-gatekeeper (which burned a runner polling and hard-failed when
#   any check took longer than its 600s timeout).
name: CI

on:
  pull_request:

# One active run per PR: pushing a new revision supersedes the previous run.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GONOPROXY: 'github.com/percona'
  GONOSUMDB: 'github.com/percona'
  GOPRIVATE: 'github.com/percona'

jobs:
  changes:
    name: Detect changes
    runs-on: cncf-ubuntu-8-32-x86
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: filter
        run: |
          # Triple-dot: only changes introduced by the PR, matching the
          # "Files changed" tab (see the copyright job for the same idiom).
          FILES=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          echo "$FILES"
          backend=false; frontend=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              ui/*) frontend=true ;;
              .github/*) backend=true; frontend=true ;;
              *) backend=true ;;
            esac
          done <<< "$FILES"
          echo "backend=$backend"   >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend frontend=$frontend"

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 30
    runs-on: cncf-ubuntu-8-32-x86
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go release
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      # CNCF (ARC) runners export a literal, unexpanded `$HOME/.config` which breaks
      # os.UserConfigDir(). Re-export it expanded until the runner image is fixed.
      - name: Normalize XDG_CONFIG_HOME
        run: echo "XDG_CONFIG_HOME=$HOME/.config" >> "$GITHUB_ENV"

      - name: Run tests
        timeout-minutes: 20
        run: |
          go clean -testcache
          make test

      - name: Check that there are no source code changes
        run: |
          # Break job if any files were changed during its run (code generation, etc), except go.sum.
          # `go mod tidy` could remove old checksums from that file, and that's okay on CI,
          # and actually expected for PRs made by @dependabot.
          # Checksums of actually used modules are checked by previous `go` subcommands.
          pushd tools && go mod tidy -v && git checkout go.sum
          popd        && go mod tidy -v && git checkout go.sum
          git diff --exit-code

      - name: Run debug commands on failure
        if: ${{ failure() }}
        run: |
          env
          go version
          go env
          pwd
          git status

  check:
    name: Check
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 10
    runs-on: cncf-ubuntu-8-32-x86
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Go release
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 9.4.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.x
          cache: "pnpm"
          cache-dependency-path: |
            ui/pnpm-lock.yaml
            api-tests/pnpm-lock.yaml

      - name: Run linters
        run: |
          # Stub the embedded UI build output so `//go:embed dist/*` typechecks (see `make build`/`make test`).
          mkdir -p ./public/dist && [ -f ./public/dist/index.html ] || touch ./public/dist/index.html
          go tool golangci-lint run --new-from-rev=$(git merge-base origin/${{ github.base_ref }} HEAD) --show-stats=false | env REVIEWDOG_GITHUB_API_TOKEN=${{ secrets.GITHUB_TOKEN }} go tool reviewdog -f=golangci-lint -reporter=github-pr-review -filter-mode=nofilter -fail-level=any

      - name: Check that there are no source code changes
        run: |
          make gen
          pushd tools && go mod tidy -v
          popd        && go mod tidy -v
          git status
          git diff --exit-code

      - name: Check that the pinned dev Helm chart is on the tracked branch
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'chart/pending') }}
        run: make check-dev-chart

      - name: Check the Makefile references dev version
        run: |
          if ! grep -q "RELEASE_VERSION ?= v0.0.0" Makefile; then 
            echo "default RELEASE_VERSION in Makefile should be 0.0.0" 
            exit 1 
          fi 

      - name: Run debug commands on failure
        if: ${{ failure() }}
        run: |
          env
          go version
          go env
          pwd
          git status

  integration_tests_api:
    name: API Integration Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 60
    runs-on: cncf-ubuntu-16-64-x86
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go release
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 9.4.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.x
          cache: "pnpm"
          cache-dependency-path: api-tests/package-lock.json

      - name: Install Kubernetes tools
        uses: ./.github/actions/install-kubernetes-tools
        with:
          install-kubectl: true
          install-kind: true

      - name: Run kind test cluster
        run: |
          make kind-cluster-up

      - name: Build Everest API Server binary
        run: |
          make build-debug

      - name: Build Everest Controller binary
        run: |
          make build-controller

      - name: Build Everest API server docker image
        run: |
          make docker-build

      - name: Upload Everest API server image to kind test cluster
        run: |
          make kind-upload-server-image

      - name: Build Everest operator docker image
        run: |
          make docker-build-operator

      - name: Upload Everest operator image to kind test cluster
        run: |
          make kind-upload-operator-image

      - name: Build Everest CLI binary
        run: |
          make build-cli-debug

      - name: Deploy Everest to kind test cluster
        timeout-minutes: 10
        run: |
          make deploy

      - name: Init testing (CI) environment
        working-directory: api-tests
        timeout-minutes: 40
        run: |
          make ci-init

      - name: Run integration tests
        working-directory: api-tests
        timeout-minutes: 20
        run: |
          make test

  integration_tests_cli:
    name: CLI Integration Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 45
    runs-on: cncf-ubuntu-16-64-x86
    env:
      PERCONA_VERSION_SERVICE_URL: https://check-dev.percona.com/versions/v1
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Go release
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build CLI binary
        run: |
          make build-cli

      - name: Create KIND cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0

      - name: Build controller and server
        run: |
          make build-debug
          make build-controller
          make docker-build

      - name: Load image to KIND cluster
        run: |
          kind load docker-image ghcr.io/openeverest/openeverest-dev:0.0.0 --name chart-testing

      - name: Run integration tests
        id: cli-tests
        run: |
          cd cli-tests
          make init
          make install-operators
          make test-cli

      - name: Attach the report
        if: ${{ always() && steps.cli-tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-tests-report
          path: cli-tests/test-report
          overwrite: true

  integration_tests_controller:
    name: Controller Integration Tests (${{ matrix.make_target }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        make_target:
          - test-integration-backup
          - test-integration-monitoring
    runs-on: cncf-ubuntu-16-64-x86
    steps:
      - name: Check out code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Go release
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install Kubernetes tools
        uses: ./.github/actions/install-kubernetes-tools
        with:
          install-kubectl: true
          install-kind: true
          install-chainsaw: true

      - name: Run kind test cluster
        run: |
          make kind-cluster-up

      - name: Run controller integration tests
        timeout-minutes: 20
        env:
          CLUSTER_PROVIDER: kind
        run: |
          make ${{ matrix.make_target }}

      - name: Run debug commands on failure
        if: ${{ failure() }}
        run: |
          kubectl describe pod -n openeverest-system -l control-plane=controller-manager
          kubectl get events -n openeverest-system --sort-by='.lastTimestamp'

  fe_checks:
    name: FE Checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    timeout-minutes: 20
    runs-on: cncf-ubuntu-8-32-x86
    defaults:
      run:
        working-directory: ui
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 9.4.0

      - name: Use Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.x
          cache: "pnpm"
          cache-dependency-path: "ui/pnpm-lock.yaml"

      - run: make init

      - name: Lint
        run: make lint-check

      - name: Format
        run: make format-check

      - name: Build
        run: make build

  fe_unit_tests:
    name: FE Unit Tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    timeout-minutes: 20
    runs-on: cncf-ubuntu-8-32-x86
    defaults:
      run:
        working-directory: ui
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 9.4.0

      - name: Use Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.x
          cache: "pnpm"
          cache-dependency-path: "ui/pnpm-lock.yaml"

      - run: make init

      - name: Unit tests
        run: |
          pnpm --filter "@percona/ui-lib" test
          pnpm --filter "@percona/everest" test:unit

  fe_browser_tests:
    name: FE Browser Tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/dev-fe-browser-tests.yaml
    secrets: inherit

  fe_e2e_tests:
    name: FE E2E Tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/dev-fe-e2e.yaml
    secrets:
      CI_USER: everestadmin
      CI_PASSWORD: everestadmin
      RBAC_USER: rbac_user
      RBAC_PASSWORD: rbac-e2e-test

  copyright:
    name: Check Copyright Headers
    timeout-minutes: 10
    runs-on: cncf-ubuntu-8-32-x86
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Check out the PR HEAD commit so file checks run on contributor changes,
          # including for pull requests from forks.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Collect changed source files
        id: changed
        run: |
          # Use the PR diff, not a plain base-vs-head tree diff.
          # This matches GitHub's "Files changed" tab and excludes files that differ
          # only because the base branch moved forward after the feature branch split.
          FILES=$(git diff --name-only --diff-filter=ACM \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            | grep -E '\.(go|ts|tsx)$' || true)

          if [[ -z "$FILES" ]]; then
            echo "No relevant files changed."
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "Files to check:"
            echo "$FILES"
            echo "$FILES" > /tmp/changed_files.txt
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.changed.outputs.any == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check copyright headers
        if: steps.changed.outputs.any == 'true'
        run: |
          make copyright-check FILES_FILE=/tmp/changed_files.txt

  ci-ok:
    name: CI OK
    needs:
      - changes
      - test
      - check
      - integration_tests_api
      - integration_tests_cli
      - integration_tests_controller
      - fe_checks
      - fe_unit_tests
      - fe_browser_tests
      - fe_e2e_tests
      - copyright
    if: ${{ always() }}
    timeout-minutes: 5
    runs-on: cncf-ubuntu-8-32-x86
    steps:
      - name: Verify job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # Skipped jobs are fine (path-filtered); anything else must succeed.
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' > /dev/null

  # Transition alias: the "Protect Main" ruleset still requires a check named
  # "Merge Gatekeeper". Remove this job once the ruleset requires "CI OK",
  # "CodeQL", and "DCO" directly.
  merge-gatekeeper:
    name: Merge Gatekeeper
    needs: [ci-ok]
    if: ${{ always() }}
    timeout-minutes: 5
    runs-on: cncf-ubuntu-8-32-x86
    steps:
      - name: Mirror CI OK
        run: test "${{ needs.ci-ok.result }}" = "success"
