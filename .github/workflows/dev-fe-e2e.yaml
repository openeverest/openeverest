name: FE E2E Workflow

on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    timeout-minutes: 60
    runs-on: cncf-ubuntu-16-64-x86
    env:
      PMM_HELM_VER: "1.3.21"
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go release
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      # Setup Node
      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Kubernetes tools
        uses: ./.github/actions/install-kubernetes-tools
        with:
          install-kubectl: true
          install-kind: true

      - name: Run kind test cluster
        run: |
          make kind-cluster-up

      - name: Set MinIO
        run: kubectl apply -f ./.github/minio.conf.yaml

      - name: Add Helm Percona repository
        shell: bash
        run: |
          go tool helm repo add percona https://percona.github.io/percona-helm-charts/

      - name: Install Helm PMM chart
        shell: bash
        run: |
          go tool helm install pmm --set secret.pmm_password='admin',service.type=ClusterIP percona/pmm --version $PMM_HELM_VER

      - name: Echo PMM credentials
        shell: bash
        run: |
          url=$(kubectl get svc/monitoring-service -o json | jq -r '.spec.clusterIP')
          echo -n "MONITORING_URL=http://$url" >> $GITHUB_ENV

      # Built once by the build_images job in ci.yaml.
      - name: Download images
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: everest-dev-images
          path: /tmp

      - name: Load images
        run: docker load -i /tmp/everest-dev-images.tar

      - name: Upload everest dev image to kind test cluster
        run: |
          make kind-upload-server-image

      - name: Build CLI
        shell: bash
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 make build-cli

      - name: Install Everest
        shell: bash
        run: |
          ./bin/everestctl install -v \
          --disable-telemetry \
          --version 0.0.0 \
          --version-metadata-url https://check-dev.percona.com \
          --skip-wizard \
          --skip-db-namespace \
          --helm.set server.image.repository=ghcr.io/openeverest/openeverest-dev \
          --helm.set server.apiRequestsRateLimit=200 \
          --helm.set versionMetadataURL=https://check-dev.percona.com

      - name: Add everest namespace
        shell: bash
        run: |
          ./bin/everestctl namespaces add everest -v \
          --operator.mongodb=true \
          --operator.postgresql=true \
          --operator.mysql=true \
          --take-ownership \
          --skip-wizard

      - name: Get Everest admin password
        shell: bash
        run: |
          echo "EVEREST_ADMIN_PASSWORD=$(./bin/everestctl accounts initial-admin-password)" >> $GITHUB_ENV

      # NodePort 30080 is mapped to host port 8080 by dev/kind_config.yaml; unlike a
      # long-lived background `kubectl port-forward`, this cannot go stale before the
      # tests start.
      - name: Expose Everest API Server
        shell: bash
        run: |
          make expose
          for i in $(seq 1 30); do
            curl -fs -o /dev/null http://localhost:8080/healthz && exit 0
            sleep 2
          done
          echo "::error::Everest API is not reachable on http://localhost:8080"
          exit 1

      - name: Run Everest UI
        shell: bash
        run: |
          cd ui
          make init
          make build
          pnpm --filter "@percona/everest" dev &

      - name: Wait for the UI dev server
        shell: bash
        run: |
          for i in $(seq 1 30); do
            curl -fs -o /dev/null http://localhost:3000 && exit 0
            sleep 2
          done
          echo "::error::UI dev server is not reachable on http://localhost:3000"
          exit 1

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('ui/pnpm-lock.yaml') }}

      - name: Install Chromium for Playwright
        shell: bash
        run: |
          cd ui/apps/everest
          # --with-deps: the CNCF runner image does not preinstall browser libraries.
          npx playwright install --with-deps chromium

      - name: Run integration tests
        shell: bash
        env:
          EVEREST_URL: "http://localhost:3000"
          EVEREST_BUCKETS_NAMESPACES_MAP: '[["bucket-1","everest"]]'
          EVEREST_LOCATION_ACCESS_KEY: "minioadmin"
          EVEREST_LOCATION_SECRET_KEY: "minioadmin"
          EVEREST_LOCATION_REGION: "us-east-1"
          EVEREST_LOCATION_URL: "https://minio.minio.svc.cluster.local"
          CI_USER: "admin"
          CI_PASSWORD: "${{ env.EVEREST_ADMIN_PASSWORD }}"
          RBAC_USER: "rbac_user"
          RBAC_PASSWORD: "rbac-e2e-test"
          MONITORING_USER: "admin"
          MONITORING_PASSWORD: "admin"
          SESSION_USER: "session"
          SESSION_PASS: "session1234"
        run: |
          cd ui
          pnpm --filter "@percona/everest" e2e

      - name: Run debug commands on failure
        if: ${{ failure() }}
        run: |
          kubectl -n everest-system describe pods
          kubectl -n everest-monitoring describe pods
          kubectl -n everest-system logs deploy/everest-server

      - name: Archive report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: ui/apps/everest/.e2e/playwright-report/
          overwrite: true
