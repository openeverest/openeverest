---
name: Release v1
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The RC/Release version, format: X.Y.Z-rcN for RC, X.Y.Z for releases"
        required: true

permissions: {}

# v1 releases run the copy of this workflow on v1.x; this one only lists it in the Actions UI.
jobs:
  wrong-branch:
    name: Wrong branch
    runs-on: ubuntu-latest
    steps:
      - name: Fail
        run: |
          echo "::error::v1 releases run from v1.x. Select v1.x under 'Use workflow from'."
          exit 1
