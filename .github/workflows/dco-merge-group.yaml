# The hosted DCO app validates sign-offs on pull requests but never reports on
# merge-group commits, which stalls the merge queue on the required "DCO"
# context. Sign-offs were already validated on the PR itself; this mirrors a
# passing check of the same name onto the merge group.
name: DCO merge-group shim

on:
  merge_group:

permissions: {}

jobs:
  dco:
    name: DCO
    timeout-minutes: 5
    runs-on: cncf-ubuntu-8-32-x86
    steps:
      - name: Pass for merge group
        run: echo "Sign-offs were validated by the DCO app on the pull request."
