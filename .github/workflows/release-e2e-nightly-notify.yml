name: Release e2e nightly notifications

on:
  workflow_run:
    workflows: ["Release e2e"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  notify-slack:
    name: Notify Slack about failed nightly release e2e
    if: >-
      github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        env:
          RELEASE_E2E_SLACK_WEBHOOK_URL: ${{ secrets.RELEASE_E2E_SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ -z "$RELEASE_E2E_SLACK_WEBHOOK_URL" ]; then
            echo "RELEASE_E2E_SLACK_WEBHOOK_URL is not configured; skipping notification"
            exit 0
          fi

          jq -n \
            --arg run "$RUN_NUMBER" \
            --arg branch "$HEAD_BRANCH" \
            --arg url "$RUN_URL" \
            '{text: ("Nightly Release e2e failed (run " + $run + ", branch " + $branch + ")\n" + $url)}' \
            | curl --fail --silent --show-error \
                -X POST \
                -H 'Content-Type: application/json' \
                --data-binary @- \
                "$RELEASE_E2E_SLACK_WEBHOOK_URL"
