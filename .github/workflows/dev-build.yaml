name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  NODE_OPTIONS: "--max_old_space_size=4096"
  GONOPROXY: 'github.com/percona'
  GONOSUMDB: 'github.com/percona'
  GOPRIVATE: 'github.com/percona'
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'openeverest/openeverest'
    runs-on: cncf-ubuntu-8-32-x86
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_PREFIX: 'ghcr.io/openeverest'
      EVEREST_SERVER_DEV_IMAGE_NAME: 'openeverest-dev'
      EVEREST_CTL_DEV_IMAGE_NAME: 'everestctl-dev'
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build Everest Frontend app
        run: |
          cd ui
          pnpm install
          EVEREST_OUT_DIR=${GITHUB_WORKSPACE}/public/dist/ pnpm build

      - name: Set up Go release
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build Everest
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 make build

      - name: Build Controller
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 make build-controller

      - name: Setup docker build metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ env.EVEREST_SERVER_DEV_IMAGE_NAME }}
          tags: 0.0.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push openeverest dev image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/package/server/Dockerfile
          target: openeverest
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Setup docker build metadata for everestctl
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: everestctl_meta
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ env.EVEREST_CTL_DEV_IMAGE_NAME }}
          tags: 0.0.0

      - name: Build and Push everestctl dev image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/package/cli/Dockerfile
          push: true
          tags: ${{ steps.everestctl_meta.outputs.tags }}

