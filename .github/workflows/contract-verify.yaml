---
# Checks that the fingerprints the latest release record holds under the
# current scheme are what the branch's own generator computes from the tag
# of that release (hack/gen-contract verify). They differ when a change to
# hack/gen-contract, its dependencies or Go changes how an unchanged
# contract hashes without naming a new scheme: every comparison with the
# record is then wrong, and the contract version moves, or fails to move,
# for no reason. See contract/MAINTAINING.md.
#
# Pull requests into main and release-* run it, and so do pushes to them,
# when they touch the generator, go.mod, go.sum or the records: each run
# verifies the code it runs on, with its own generator. Those are the only
# ways the result can change, since go.mod pins Go and go.sum the
# generator's dependencies.
#
# The nightly run verifies main, and checks through the API that every v2
# release branch, release-X.Y with X of 2 or more, carries the contract.
# It never checks out another branch: a scheduled run has the privileges of
# the default branch, its cache scope included, which the code of another
# branch must not get. Only v1 predates the contract: a v2 release branch
# without it fails, with what to do. A release branch cut before the
# contract, such as release-2.0, gets it when main is merged into it to
# prepare its next pre-release. While the latest record is the seed, which
# has no fingerprints, there is nothing to verify.
name: Contract verify

on:
  pull_request:
    branches:
      - main
      - 'release-*'
    paths:
      - 'hack/gen-contract/**'
      - 'go.mod'
      - 'go.sum'
      - 'contract/releases/**'
  push:
    branches:
      - main
      - 'release-*'
    paths:
      - 'hack/gen-contract/**'
      - 'go.mod'
      - 'go.sum'
      - 'contract/releases/**'
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify the latest release record
    runs-on: cncf-ubuntu-8-32-x86
    timeout-minutes: 15
    steps:
      # The head of the pull request, or the commit the run is on: never
      # the code of another branch.
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # The generator cannot say this: a branch without the contract has
      # none. contract-decision checks the branches of pull requests.
      - name: Check that ${{ github.ref_name }} carries the contract
        if: github.event_name != 'pull_request'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          for path in contract/VERSION contract/releases; do
            if [[ -e $path ]]; then
              continue
            fi
            if [[ $BRANCH == main ]]; then
              fix="Restore it on main."
            else
              fix="Merge main into $BRANCH when preparing its next pre-release, which brings the contract to a release branch cut before it; until then this check fails."
            fi
            echo "::error title=Contract verify::$BRANCH is a v2 branch, which carries the contract, but it has no $path, so the record of its latest release cannot be verified. $fix See contract/MAINTAINING.md."
            exit 1
          done

      # The cache is the run's own: that of the pull request, or of the
      # branch the code was pushed to or the run is on.
      - name: Set up Go release
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify the latest release record
        run: |
          set -euo pipefail

          tag="v$(go run ./hack/gen-contract latest)"
          git fetch --no-tags --depth=1 origin "refs/tags/$tag:refs/tags/$tag" || true
          go run ./hack/gen-contract verify

  release-branches:
    name: Check that the v2 release branches carry the contract
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: cncf-ubuntu-8-32-x86
    timeout-minutes: 5
    steps:
      # Through the API, without checking anything out: this run has the
      # privileges of the branch it runs on, which the code of another
      # branch must not get. Pushes to a release branch verify its record
      # with its own generator, in the context of that branch.
      - name: Check the v2 release branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # has reports whether branch $1 holds path $2, and fails on any
          # error but a 404.
          has() {
            local out
            if out=$(gh api "repos/$REPO/contents/$2?ref=$1" --silent 2>&1); then
              return 0
            fi
            if [[ $out == *"HTTP 404"* ]]; then
              return 1
            fi
            echo "::error title=Contract verify::Cannot read $2 on $1: $out"
            exit 1
          }

          branches=$(gh api "repos/$REPO/branches" --paginate --jq '.[].name | select(startswith("release-"))')
          failed=0
          while IFS= read -r branch; do
            # v1 release branches predate the contract.
            if [[ ! $branch =~ ^release-([0-9]+)\.[0-9]+$ ]] || (( BASH_REMATCH[1] < 2 )); then
              continue
            fi
            ok=1
            for path in contract/VERSION contract/releases; do
              if ! has "$branch" "$path"; then
                echo "::error title=Contract verify::$branch is a v2 release branch, which carries the contract, but it has no $path, so the record of its latest release cannot be verified. Merge main into $branch when preparing its next pre-release, which brings the contract to a release branch cut before it; until then this check fails. See contract/MAINTAINING.md."
                ok=0
                failed=1
              fi
            done
            if (( ok )); then
              echo "$branch carries the contract."
            fi
          done <<< "$branches"
          exit "$failed"
