---
name: 'Install Kubernetes Tools'
description: 'Installs Kubernetes-related CLI tools (kubectl, kind, k3d, chainsaw)'
inputs:
  tools-path:
    description: 'Tools path to install binaries'
    required: false
    # $HOME expands in the shell steps below; user-writable on any runner.
    default: '$HOME/.local/bin'
  install-kubectl:
    description: 'Install Kubectl'
    required: false
    default: false
  kubectl-version:
    description: 'Kubectl version to install'
    required: false
    # Keep within one minor of the kindest/node image pinned in dev/kind_config.yaml
    # (kubectl version skew policy).
    default: '1.36.1'
  install-k3d:
    description: 'Install K3D'
    required: false
    default: false
  k3d-version:
    description: 'K3D version to install'
    required: false
    default: '5.8.3'
  install-kind:
    description: 'Install kind'
    required: false
    default: false
  kind-version:
    description: 'kind version to install'
    required: false
    default: '0.32.0'
  install-chainsaw:
    description: 'Install Chainsaw'
    required: false
    default: 'false'
  chainsaw-version:
    description: 'Chainsaw version (without the leading v)'
    required: false
    default: '0.2.14'
runs:
  using: "composite"
  steps:
    - name: Install TOOLS_PATH
      run: |
        mkdir -p ${{ inputs.tools-path }}
        echo ${{ inputs.tools-path }} >> $GITHUB_PATH
      shell: bash

    - name: Install Kubectl
      if: ${{ inputs.install-kubectl == 'true' }}
      run: |
        BASE=https://dl.k8s.io/release/v${{ inputs.kubectl-version }}/bin/linux/amd64
        DEST=${{ inputs.tools-path }}/kubectl
        curl -fsSL -o "$DEST" "$BASE/kubectl"
        curl -fsSL -o "$DEST.sha256" "$BASE/kubectl.sha256"
        echo "$(cat "$DEST.sha256")  $DEST" | sha256sum --check --status
        rm "$DEST.sha256"
        chmod +x "$DEST"
        kubectl version --client
      shell: bash

    - name: Install K3D
      if: ${{ inputs.install-k3d == 'true' }}
      run: |
        BASE=https://github.com/k3d-io/k3d/releases/download/v${{ inputs.k3d-version }}
        DEST=${{ inputs.tools-path }}/k3d
        curl -fsSL -o "$DEST" "$BASE/k3d-linux-amd64"
        curl -fsSL -o /tmp/k3d_checksums.txt "$BASE/checksums.txt"
        grep ' _dist/k3d-linux-amd64$' /tmp/k3d_checksums.txt \
          | awk -v dest="$DEST" '{print $1 "  " dest}' | sha256sum --check --status
        rm /tmp/k3d_checksums.txt
        chmod +x "$DEST"
        k3d version
      shell: bash

    - name: Install kind
      if: ${{ inputs.install-kind == 'true' }}
      run: |
        curl -fsSL -o ${{ inputs.tools-path }}/kind https://kind.sigs.k8s.io/dl/v${{ inputs.kind-version }}/kind-linux-amd64
        curl -fsSL -o /tmp/kind.sha256sum https://kind.sigs.k8s.io/dl/v${{ inputs.kind-version }}/kind-linux-amd64.sha256sum
        echo "$(awk '{print $1}' /tmp/kind.sha256sum)  ${{ inputs.tools-path }}/kind" | sha256sum --check --status
        rm /tmp/kind.sha256sum
        chmod +x ${{ inputs.tools-path }}/kind
        kind version
      shell: bash

    - name: Install Chainsaw
      if: ${{ inputs.install-chainsaw == 'true' }}
      uses: kyverno/action-install-chainsaw@06560d18422209e9c1e08e931d477d04bf2674c1 # v0.2.14
      with:
        release: v${{ inputs.chainsaw-version }}
