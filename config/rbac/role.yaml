  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - extensions.openeverest.io
  resources:
  - installedextensions/finalizers
  - plugins/finalizers
  verbs:
  - update
- apiGroups:
  - extensions.openeverest.io
  resources:
  - installedextensions/status
  - plugins/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - monitoring.openeverest.io
  resources:
  - monitoringbindings
  verbs:
  - create
  - delete
  - get
  - list
  - update
  - watch
- apiGroups:
  - monitoring.openeverest.io
  resources:
  - monitoringbindings/status
  - monitoringclasses/status
