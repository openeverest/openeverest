  verbs:
  - patch
- apiGroups:
  - monitoring.openeverest.io
  resources:
  - monitoringclasses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - monitoring.openeverest.io
  resources:
  - monitoringdestinations
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - monitoring.openeverest.io
  resources:
  - monitoringdestinations/finalizers
  verbs:
  - update
