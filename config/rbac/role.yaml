---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
- apiGroups:
  - monitoring.openeverest.io
  resources:
  - databaseclusters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - monitoring.openeverest.io
  resources:
  - monitoringconfigs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - monitoring.openeverest.io
  resources:
  - monitoringconfigs/status
  verbs:
  - get
  - patch
  - update
