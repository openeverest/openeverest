---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - update
  - watch
- apiGroups:
  - backup.openeverest.io
  resources:
  - backupclasses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - backup.openeverest.io
  resources:
  - backupimports
  - backups
  - backupstorages
  - restores
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - backup.openeverest.io
  resources:
  - backupimports/status
  - backups/status
  - backupstorages/status
  - restores/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - backup.openeverest.io
  resources:
  - backupstorages/finalizers
  verbs:
  - update
- apiGroups:
  - core.openeverest.io
  resources:
  - instances
  - providers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - core.openeverest.io
  resources:
  - instances/finalizers
  verbs:
  - update
- apiGroups:
