# Requires get on every Secret a MonitoringDestination or BackupStorage
# names, on CREATE and on any UPDATE that changes spec (spec 018 §4.5, spec
# 020 §4.4). Naming a Secret the writer cannot read would let the executor
# use its keys, and pointing an object at another endpoint while it keeps its
# Secret sends the credentials there; core cannot tell which class parameters
# steer traffic, so every spec change re-checks every reference, changed or
# not. Metadata-only updates, such as core's finalizers, are admitted, and
# status writes use the status subresource, which this policy does not match.
#
# For writes through the HTTP API the authorizer sees the API server's
# ServiceAccount, which may get every Secret; the API's RBAC handlers apply
# the same rule there with Casbin's secrets:use action.
#
# BackupStorage still names its Secret in spec.s3.credentialsSecretRef, which
# these expressions read as absent; they apply once it moves to
# spec.authentication and spec.tls (spec 017).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: secret-reference.openeverest.io
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["monitoring.openeverest.io"]
      apiVersions: ["*"]
      operations: ["CREATE", "UPDATE"]
      resources: ["monitoringdestinations"]
    - apiGroups: ["backup.openeverest.io"]
      apiVersions: ["*"]
      operations: ["CREATE", "UPDATE"]
      resources: ["backupstorages"]
  validations:
  - expression: >-
      !object.spec.?authentication.?credentialsSecretRef.hasValue() ||
      (oldObject != null && object.spec == oldObject.spec) ||
      authorizer.group('').resource('secrets').namespace(object.metadata.namespace)
      .name(object.spec.authentication.credentialsSecretRef.name).check('get').allowed()
    messageExpression: >-
      'you need get on Secret ' + object.spec.authentication.credentialsSecretRef.name +
      ' to reference it or to change an object that uses it'
    reason: Forbidden
  - expression: >-
      !object.spec.?tls.?ca.?secretKeyRef.hasValue() ||
      (oldObject != null && object.spec == oldObject.spec) ||
      authorizer.group('').resource('secrets').namespace(object.metadata.namespace)
      .name(object.spec.tls.ca.secretKeyRef.name).check('get').allowed()
    messageExpression: >-
      'you need get on Secret ' + object.spec.tls.ca.secretKeyRef.name +
      ' to reference it or to change an object that uses it'
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: secret-reference.openeverest.io
spec:
  policyName: secret-reference.openeverest.io
  validationActions: ["Deny"]
