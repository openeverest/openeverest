# Refuses deleting a MonitoringDestination while Instances list it (spec 015
# §4.5). The core controller keeps status.attachedInstances up to date and
# holds the monitoring.openeverest.io/in-use-protection finalizer for a
# deletion admitted before the count caught up. A namespace being deleted is
# exempt: no Instance can be added to it, and the finalizer still waits for
# its Instances to go.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: monitoringdestination-in-use.monitoring.openeverest.io
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["monitoring.openeverest.io"]
      apiVersions: ["*"]
      operations: ["DELETE"]
      resources: ["monitoringdestinations"]
  variables:
  - name: attached
    expression: oldObject.?status.?attachedInstances.orValue(0)
  validations:
  - expression: >-
      variables.attached == 0 ||
      namespaceObject.metadata.?deletionTimestamp.hasValue()
    messageExpression: >-
      'in use by ' + string(variables.attached) +
      (variables.attached == 1 ? ' database' : ' databases') +
      '; remove the destination from them first (kubectl get monitoringbindings -n ' +
      oldObject.metadata.namespace + ' -l monitoring.openeverest.io/destination=' +
      oldObject.metadata.name + ')'
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: monitoringdestination-in-use.monitoring.openeverest.io
spec:
  policyName: monitoringdestination-in-use.monitoring.openeverest.io
  validationActions: ["Deny"]
