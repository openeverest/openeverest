---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: providers.core.openeverest.io
spec:
  group: core.openeverest.io
  names:
    kind: Provider
    listKind: ProviderList
    plural: providers
    shortNames:
    - pr
    - prv
    - prov
    singular: provider
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Provider is the Schema for the providers API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ProviderSpec defines the desired state of Provider
            properties:
              componentTypes:
                additionalProperties:
                  properties:
                    versions:
                      items:
                        properties:
                          default:
                            type: boolean
                          deprecated:
                            description: |-
                              Deprecated marks a version as still supported but scheduled for
                              removal. Instances running on it get a proactive warning with a
                              remediation runway instead of a blocked upgrade.
                            type: boolean
                          image:
                            type: string
                          removedInVersion:
                            description: |-
                              RemovedInVersion is the provider version (P) in which this engine
                              version is dropped. Upgrading the provider to >= this version while
                              an Instance still uses this engine version is a blocking error.
                            type: string
                          version:
                            type: string
                        type: object
                      type: array
                  type: object
                type: object
              components:
                additionalProperties:
                  properties:
                    parametersSchema:
                      description: |-
                        ParametersSchema declares the OpenAPI v3 schema for this component's
                        parameters payload (Instance.spec.components[].parameters).
                      properties:
                        openAPIV3Schema:
                          description: |-
                            OpenAPIV3Schema is the OpenAPI v3 schema describing the accepted
                            parameters payload.
                          x-kubernetes-preserve-unknown-fields: true
                      type: object
                    type:
                      type: string
                  type: object
                type: object
              configMaps:
                additionalProperties:
                  description: ConfigMapDefinition describes a ConfigMap type that
                    a provider supports.
                  properties:
                    parametersSchema:
                      description: ParametersSchema declares the OpenAPI v3 schema
                        for validating configmap data/binaryData.
                      properties:
                        openAPIV3Schema:
                          description: |-
                            OpenAPIV3Schema is the OpenAPI v3 schema describing the accepted
                            parameters payload.
                          x-kubernetes-preserve-unknown-fields: true
                      type: object
                    uiSchema:
                      description: UISchema holds UI rendering hints for the configmap
                        creation form.
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                  type: object
                description: ConfigMaps defines ConfigMap types this provider supports.
                type: object
              parametersSchema:
                description: |-
                  ParametersSchema declares the OpenAPI v3 schema for the instance-wide
                  parameters payload (Instance.spec.parameters).
                properties:
                  openAPIV3Schema:
                    description: |-
                      OpenAPIV3Schema is the OpenAPI v3 schema describing the accepted
                      parameters payload.
                    x-kubernetes-preserve-unknown-fields: true
                type: object
              release:
                description: |-
                  Release identifies this provider release — the shipped unit of
                  controller, bundled operator, and version catalog — and its
                  upgrade-path constraints. It is read by the pre-upgrade preflight.
                properties:
                  minUpgradableFrom:
                    description: |-
                      MinUpgradableFrom is the lowest provider release version from which a
                      single-step upgrade to this release is permitted; a lower installed
                      version is blocked and must step through intermediate releases.
                      Empty means no floor.
                    type: string
                  version:
                    description: |-
                      Version is the provider release version (P), populated from the chart
                      appVersion (e.g. "0.3"). Named distinctly from ProviderSpec.Versions
                      (the engine bundle catalog).
                    type: string
                type: object
              secrets:
                additionalProperties:
                  description: SecretDefinition describes a Secret type that a provider
                    supports.
                  properties:
                    parametersSchema:
                      description: ParametersSchema declares the OpenAPI v3 schema
                        for validating secret data/stringData.
                      properties:
                        openAPIV3Schema:
                          description: |-
                            OpenAPIV3Schema is the OpenAPI v3 schema describing the accepted
                            parameters payload.
                          x-kubernetes-preserve-unknown-fields: true
                      type: object
                    uiSchema:
                      description: UISchema holds UI rendering hints for the secret
                        creation form.
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                  type: object
                description: Secrets defines Secret types this provider supports.
                type: object
              topologies:
                additionalProperties:
                  properties:
                    components:
                      additionalProperties:
                        properties:
                          optional:
                            type: boolean
                          supportedFields:
                            description: |-
                              SupportedFields declares which ComponentSpec fields this component
                              honours in this topology, as an OpenAPI v3 schema over ComponentSpec's
                              own properties. A property is declared if and only if the provider
                              reads it, at any depth, so a component may honour part of a grouped
                              field such as schedulingPolicy. Constraints the provider enforces
                              (required, bounds) are expressed with the same schema vocabulary.

                              Applicability is declared per topology because core fields configure
                              the deployment, and the deployment shape is what a topology chooses.

                              When unset, no constraint is placed on the component and every field
                              is accepted, which is the behaviour of providers that do not declare.
                            properties:
                              openAPIV3Schema:
                                description: |-
                                  OpenAPIV3Schema is the OpenAPI v3 schema describing the accepted
                                  parameters payload.
                                x-kubernetes-preserve-unknown-fields: true
                            type: object
                        type: object
                      type: object
                    parametersSchema:
                      description: |-
                        ParametersSchema declares the OpenAPI v3 schema for topology-specific
                        parameters (Instance.spec.topology.parameters).
                      properties:
                        openAPIV3Schema:
                          description: |-
                            OpenAPIV3Schema is the OpenAPI v3 schema describing the accepted
                            parameters payload.
                          x-kubernetes-preserve-unknown-fields: true
                      type: object
                  type: object
                type: object
              uiSchema:
                description: UISchema holds the UI rendering hints for each topology.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              versions:
                description: |-
                  Versions defines curated version bundles — named sets of component
                  versions that are known to be mutually compatible. Users reference
                  a bundle via Instance.Spec.Version. If the user does not set a version,
                  the bundle whose Default field is true is used automatically.
                items:
                  description: |-
                    VersionBundle is a curated set of component versions known to be mutually
                    compatible. Provider developers define bundles in definition/versions.yaml.
                  properties:
                    components:
                      additionalProperties:
                        type: string
                      description: |-
                        Components maps component names to their version strings for this bundle.
                        Keys must match component names defined in ProviderSpec.Components.
                      type: object
                    default:
                      description: |-
                        Default marks this bundle as the implicit choice when an Instance omits
                        Spec.Version entirely. Exactly one bundle should have Default: true.
                      type: boolean
                    name:
                      description: |-
                        Name is the unique identifier for this bundle (e.g. "8.0.12").
                        Users set Instance.Spec.Version to this value to select the bundle.
                      type: string
                  required:
                  - name
                  type: object
                type: array
            type: object
          status:
            description: ProviderStatus defines the observed state of Provider.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
