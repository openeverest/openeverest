---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: backupstorages.backup.openeverest.io
spec:
  group: backup.openeverest.io
  names:
    kind: BackupStorage
    listKind: BackupStorageList
    plural: backupstorages
    shortNames:
    - bstor
    singular: backupstorage
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.backupStorageClassRef.name
      name: Type
      type: string
    - jsonPath: .spec.location.bucket
      name: Bucket
      type: string
    - jsonPath: .spec.authentication.mode
      name: Auth
      type: string
    - jsonPath: .status.conditions[?(@.type=="Accepted")].reason
      name: Accepted
      type: string
    - jsonPath: .spec.tls.insecureSkipVerify
      name: Insecure
      priority: 1
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: BackupStorage is the Schema for the backupstorages API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              BackupStorageSpec defines the desired state of a BackupStorage: an object
              store, of the technology a BackupStorageClass describes, that backups are
              written to. It is referenced by name from Instance.spec.backup.storages,
              Backup.spec.storageRef, Restore point-in-time sources and BackupImports.
            properties:
              authentication:
                description: |-
                  Authentication names one of the class's authModes and, for every mode
                  but WorkloadIdentity, the Secret in the same namespace holding that
                  mode's credentials keys.
                properties:
                  credentialsSecretRef:
                    description: |-
                      CredentialsSecretRef references the Secret in the same namespace that
                      holds the credentials keys of the mode.
                    properties:
                      name:
                        description: Name of the referenced Secret.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                    required:
                    - name
                    type: object
                    x-kubernetes-map-type: atomic
                  mode:
                    description: Mode names one of the class's authModes.
                    pattern: ^[A-Z][A-Za-z0-9]{0,62}$
                    type: string
                required:
                - mode
                type: object
                x-kubernetes-validations:
                - message: a BackupStorage cannot use the Anonymous authentication
                    mode
                  rule: self.mode != 'Anonymous'
                - message: credentialsSecretRef is required for every mode except
                    WorkloadIdentity and Anonymous, which take none
                  rule: (self.mode in ['WorkloadIdentity', 'Anonymous']) != has(self.credentialsSecretRef)
              backupStorageClassRef:
                description: |-
                  BackupStorageClassRef names the BackupStorageClass, the object storage
                  technology.
                properties:
                  name:
                    description: Name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: backupStorageClassRef is immutable
                  rule: self == oldSelf
              location:
                description: |-
                  Location is where backups are kept. Engines treat it as their catalog,
                  so it cannot change: create a new BackupStorage instead.
                properties:
                  bucket:
                    description: |-
                      Bucket is the bucket, or the container for technologies that call it
                      so.
                    maxLength: 255
                    minLength: 1
                    pattern: ^[^/]+$
                    type: string
                  prefix:
                    description: |-
                      Prefix is the path within the bucket under which backups are written,
                      without leading or trailing slash.
                    maxLength: 512
                    pattern: ^([^/]+(/[^/]+)*)?$
                    type: string
                    x-kubernetes-validations:
                    - message: prefix must not contain '.' or '..' segments
                      rule: '!self.split(''/'').exists(s, s == ''.'' || s == ''..'')'
                required:
                - bucket
                type: object
                x-kubernetes-validations:
                - message: location is immutable
                  rule: self == oldSelf
              parameters:
                description: |-
                  Parameters are the connection parameters of the technology, validated
                  against the class's parametersSchema.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              tls:
                description: |-
                  TLS is how executors verify the server certificate of the store.
                  Absent means the system trust store.
                properties:
                  ca:
                    description: |-
                      CA is the PEM bundle the server certificate is verified against,
                      instead of the system trust store.
                    minProperties: 1
                    properties:
                      secretKeyRef:
                        description: SecretKeyRef selects the Secret key holding the
                          PEM bundle.
                        properties:
                          key:
                            description: Key within the Secret.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[-._a-zA-Z0-9]+$
                            type: string
                          name:
                            description: Name of the referenced Secret.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                            type: string
                        required:
                        - key
                        - name
                        type: object
                        x-kubernetes-map-type: atomic
                    type: object
                  insecureSkipVerify:
                    description: InsecureSkipVerify disables verification of the server
                      certificate.
                    type: boolean
                type: object
                x-kubernetes-validations:
                - message: ca and insecureSkipVerify are mutually exclusive
                  rule: '!(has(self.ca) && has(self.insecureSkipVerify) && self.insecureSkipVerify)'
            required:
            - authentication
            - backupStorageClassRef
            - location
            type: object
          status:
            description: BackupStorageStatus defines the observed state of a BackupStorage.
            properties:
              backupClasses:
                description: |-
                  BackupClasses lists every BackupClass and whether it can write to the
                  storage.
                items:
                  description: |-
                    BackupClassCompatibility is whether a BackupClass can write to a
                    BackupStorage.
                  properties:
                    compatible:
                      description: |-
                        Compatible is true when the BackupClass supports the storage's class and
                        authentication mode.
                      type: boolean
                    name:
                      description: Name of the BackupClass.
                      type: string
                    reason:
                      description: Reason is why the BackupClass cannot write to the
                        storage.
                      type: string
                  required:
                  - compatible
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              conditions:
                description: |-
                  Conditions: Accepted, written by core, and Deleting while a deleted
                  storage waits for its referrers.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
