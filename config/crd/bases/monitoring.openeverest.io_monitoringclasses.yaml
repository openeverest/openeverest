---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: monitoringclasses.monitoring.openeverest.io
spec:
  group: monitoring.openeverest.io
  names:
    kind: MonitoringClass
    listKind: MonitoringClassList
    plural: monitoringclasses
    shortNames:
    - mclass
    singular: monitoringclass
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.controllerName
      name: Controller
      type: string
    - jsonPath: .status.conditions[?(@.type=="Accepted")].status
      name: Accepted
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          MonitoringClass is the Schema for the monitoringclasses API. One per
          monitoring technology, claimed by an out-of-tree controller.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: MonitoringClassSpec defines the desired state of MonitoringClass.
            properties:
              controllerName:
                description: |-
                  ControllerName is the domain-prefixed name of the controller that
                  fulfils this class (e.g. "openeverest.io/monitoring-pmm"). Only that
                  controller sets the Accepted condition.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/[A-Za-z0-9/\-._~%!$&'()*+,;=:]+$
                type: string
              credentialsSchema:
                description: |-
                  CredentialsSchema lists the keys the MonitoringDestination credentials
                  Secret must carry.
                properties:
                  required:
                    description: Required is the list of required Secret keys.
                    items:
                      type: string
                    type: array
                type: object
              description:
                description: Description describes the monitoring technology.
                type: string
              destinationParametersSchema:
                description: DestinationParametersSchema validates MonitoringDestination.spec.parameters.
                properties:
                  openAPIV3Schema:
                    description: |-
                      OpenAPIV3Schema is the OpenAPI v3 schema describing the accepted
                      parameters payload.
                    x-kubernetes-preserve-unknown-fields: true
                type: object
              displayName:
                description: DisplayName is a human-readable name for the monitoring
                  technology.
                type: string
              extensionManaged:
                description: |-
                  ExtensionManaged declares that the class controller wires the backend
                  from the provider's monitoring contract alone (Instance.status.monitoring.sources).
                properties:
                  degrades:
                    description: |-
                      Degrades lists the capabilities lost compared to a ProviderManaged
                      fulfilment of the same class (e.g. "slowLogQAN").
                    items:
                      type: string
                    type: array
                  requires:
                    description: |-
                      Requires lists the source capabilities a component must satisfy to
                      be eligible for this class.
                    properties:
                      credentialProfiles:
                        description: |-
                          CredentialProfiles requires the component to offer these credential
                          profiles (all-of).
                        items:
                          type: string
                        type: array
                      features:
                        description: |-
                          Features requires the component to offer these engine features
                          (all-of).
                        items:
                          type: string
                        type: array
                      kinds:
                        description: Kinds restricts eligibility to components of
                          these kinds (any-of).
                        items:
                          type: string
                        type: array
                      metrics:
                        description: |-
                          Metrics requires the component to expose OpenMetrics
                          (metrics: Native or Exporter).
                        type: boolean
                    type: object
                type: object
              instanceParametersSchema:
                description: |-
                  InstanceParametersSchema validates
                  Instance.spec.monitoring.destinations[].parameters.
                properties:
                  openAPIV3Schema:
                    description: |-
                      OpenAPIV3Schema is the OpenAPI v3 schema describing the accepted
                      parameters payload.
                    x-kubernetes-preserve-unknown-fields: true
                type: object
              providerManaged:
                description: |-
                  ProviderManaged declares that providers whose engine operator natively
                  integrates this technology render it themselves inside Sync. Matched
                  against Provider.spec.monitoring.integrations.
                properties:
                  agentImage:
                    description: |-
                      AgentImage is the agent image the provider renders into the engine
                      pods. It is admin-controlled: only class writers can change what runs
                      next to the data volumes.
                    type: string
                  agentVersion:
                    description: |-
                      AgentVersion is the semantic version of AgentImage, matched against
                      Provider.spec.monitoring.integrations.<integration>.agentVersions.
                    type: string
                  features:
                    description: |-
                      Features lists what the integration delivers beyond metrics
                      (e.g. "queryAnalytics"), used for user-facing disclosure.
                    items:
                      type: string
                    type: array
                  integration:
                    description: |-
                      Integration is the integration name providers declare in
                      Provider.spec.monitoring.integrations (e.g. "pmm").
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - integration
                type: object
              uiSchema:
                description: UISchema holds free-form rendering hints consumed only
                  by the UI.
                type: object
                x-kubernetes-preserve-unknown-fields: true
            required:
            - controllerName
            type: object
            x-kubernetes-validations:
            - message: a MonitoringClass must declare at least one fulfilment block
                (providerManaged or extensionManaged)
              rule: has(self.providerManaged) || has(self.extensionManaged)
            - message: spec.controllerName is immutable
              rule: self.controllerName == oldSelf.controllerName
            - message: spec.providerManaged cannot be removed once set
              rule: '!has(oldSelf.providerManaged) || has(self.providerManaged)'
            - message: spec.extensionManaged cannot be removed once set
              rule: '!has(oldSelf.extensionManaged) || has(self.extensionManaged)'
            - message: spec.providerManaged.integration is immutable
              rule: '!has(oldSelf.providerManaged) || self.providerManaged.integration
                == oldSelf.providerManaged.integration'
          status:
            description: MonitoringClassStatus defines the observed state of MonitoringClass.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
