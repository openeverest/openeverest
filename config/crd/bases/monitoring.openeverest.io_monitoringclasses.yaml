---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: monitoringclasses.monitoring.openeverest.io
spec:
  group: monitoring.openeverest.io
  names:
    kind: MonitoringClass
    listKind: MonitoringClassList
    plural: monitoringclasses
    shortNames:
    - mclass
    singular: monitoringclass
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Accepted")].reason
      name: Accepted
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          MonitoringClass is one monitoring technology, claimed by the out-of-tree
          controller that serves it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: MonitoringClassSpec defines the desired state of MonitoringClass.
            properties:
              authModes:
                description: |-
                  AuthModes lists the authentication methods a MonitoringDestination of
                  this class can use. A mode the class defines is Secret-backed and lists
                  its credentials keys; WorkloadIdentity and Anonymous are reserved by
                  core and take no Secret.
                items:
                  description: |-
                    AuthMode is one authentication method a class supports. A mode the class
                    defines lists the credentials Secret keys it needs; the reserved modes
                    (WorkloadIdentity, Anonymous) list none.
                  properties:
                    credentials:
                      description: Credentials lists the keys the credentials Secret
                        must or may carry.
                      properties:
                        optional:
                          description: Optional keys are read when present.
                          items:
                            maxLength: 253
                            pattern: ^[-._a-zA-Z0-9]+$
                            type: string
                          maxItems: 16
                          type: array
                          x-kubernetes-list-type: set
                        required:
                          description: Required keys must be present and non-empty.
                          items:
                            maxLength: 253
                            pattern: ^[-._a-zA-Z0-9]+$
                            type: string
                          maxItems: 16
                          minItems: 1
                          type: array
                          x-kubernetes-list-type: set
                      required:
                      - required
                      type: object
                    name:
                      description: Name identifies the mode, in PascalCase (e.g. AccessKey,
                        BasicAuth).
                      pattern: ^[A-Z][A-Za-z0-9]{0,62}$
                      type: string
                  required:
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: WorkloadIdentity and Anonymous take no credentials; every
                      other mode must declare its credentials keys
                    rule: (self.name in ['WorkloadIdentity', 'Anonymous']) != has(self.credentials)
                maxItems: 16
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              description:
                description: Description describes the monitoring technology.
                type: string
              destinationParametersSchema:
                description: DestinationParametersSchema validates MonitoringDestination.spec.parameters.
                properties:
                  openAPIV3Schema:
                    description: |-
                      OpenAPIV3Schema is the OpenAPI v3 schema describing the accepted
                      parameters payload.
                    x-kubernetes-preserve-unknown-fields: true
                type: object
              displayName:
                description: DisplayName is a human-readable name for the monitoring
                  technology.
                type: string
              extensionManaged:
                description: |-
                  ExtensionManaged declares that the class controller wires the backend
                  from the provider's monitoring contract alone
                  (Instance.status.monitoring.sources).
                properties:
                  requires:
                    description: |-
                      Requires lists the source capabilities a component must satisfy to
                      be eligible for this class.
                    properties:
                      metrics:
                        description: |-
                          Metrics requires the component to expose OpenMetrics
                          (metrics: Native or Exporter).
                        type: boolean
                    type: object
                type: object
              instanceParametersSchema:
                description: |-
                  InstanceParametersSchema validates
                  Instance.spec.monitoring.destinations[].parameters.
                properties:
                  openAPIV3Schema:
                    description: |-
                      OpenAPIV3Schema is the OpenAPI v3 schema describing the accepted
                      parameters payload.
                    x-kubernetes-preserve-unknown-fields: true
                type: object
              providerManaged:
                description: |-
                  ProviderManaged declares that providers whose engine operator natively
                  integrates this technology render it themselves inside Sync. Matched
                  against Provider.spec.monitoring.integrations.
                properties:
                  agentImage:
                    description: |-
                      AgentImage is the agent image the provider renders into the engine
                      pods. It is admin-controlled: only class writers can change what runs
                      next to the data volumes.
                    minLength: 1
                    type: string
                  agentVersion:
                    description: |-
                      AgentVersion is the semantic version of AgentImage, matched against
                      Provider.spec.monitoring.integrations.<integration>.agentVersions.
                    minLength: 1
                    type: string
                  integration:
                    description: |-
                      Integration is the integration name providers declare in
                      Provider.spec.monitoring.integrations (e.g. "pmm"). Immutable.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                    x-kubernetes-validations:
                    - message: spec.providerManaged.integration is immutable
                      rule: self == oldSelf
                required:
                - agentImage
                - agentVersion
                - integration
                type: object
              uiSchema:
                description: |-
                  UISchema holds free-form form-rendering hints consumed only by the UI,
                  grouped by the form they decorate (destination, instance, and
                  credentials keyed by authentication mode).
                type: object
                x-kubernetes-preserve-unknown-fields: true
              urlPolicy:
                default: Optional
                description: URLPolicy says whether MonitoringDestination.spec.url
                  must be set.
                enum:
                - Required
                - Optional
                type: string
            required:
            - authModes
            type: object
            x-kubernetes-validations:
            - message: a MonitoringClass must declare at least one fulfilment block
                (providerManaged or extensionManaged)
              rule: has(self.providerManaged) || has(self.extensionManaged)
            - message: spec.providerManaged cannot be removed once set
              rule: '!has(oldSelf.providerManaged) || has(self.providerManaged)'
            - message: spec.extensionManaged cannot be removed once set
              rule: '!has(oldSelf.extensionManaged) || has(self.extensionManaged)'
          status:
            default:
              conditions:
              - lastTransitionTime: "1970-01-01T00:00:00Z"
                message: Waiting for controller
                reason: Pending
                status: Unknown
                type: Accepted
            description: |-
              MonitoringClassStatus defines the observed state of MonitoringClass. It
              has two writers, each applying only its own fields: the claiming
              controller owns the Accepted condition and core owns providers.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              providers:
                description: |-
                  Providers is the compatibility of this class with every installed
                  Provider.
                items:
                  description: |-
                    ProviderCompatibility is the class's compatibility with one Provider,
                    computed by core from Provider.spec.monitoring.
                  properties:
                    disruption:
                      description: |-
                        Disruption is the worst that enabling the class does to the pods of
                        one of the Provider's Instances. Set when Mode is set.
                      enum:
                      - None
                      - RollingRestart
                      type: string
                    message:
                      description: Message is the human-readable detail for Reason.
                      type: string
                    mode:
                      description: |-
                        Mode is the execution mode a binding of this class gets for the
                        Provider's Instances. Empty when the Provider is incompatible.
                      enum:
                      - ProviderManaged
                      - ExtensionManaged
                      type: string
                    name:
                      description: Name is the Provider name.
                      type: string
                    reason:
                      description: Reason explains an empty Mode.
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: a MonitoringClass name must be at most 63 characters
          rule: size(self.metadata.name) <= 63
