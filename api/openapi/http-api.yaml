openapi: 3.0.2
servers:
  - url: /v1
info:
  version: 1.0.0
  title: OpenEverest schema
  description: |
    # Authentication
    All requests to Everest API require `Authorization: Bearer <token>` header with a valid token in plain-text.
    
    The token can be obtained by using `everestctl token reset` which resets the token and prints it to the screen.

    # Warnings
    A response carries one `Warning` header per distinct warning Kubernetes raised while handling the request, whether it succeeds or fails: an admission webhook warning on a write, for example, or the deprecation of a resource version.
    Each value has Kubernetes' warning format, `299 - "<text>"`, the `Warning` field of RFC 7234.

    # Dry run
    Writes that accept the `dryRun=All` query parameter run every check a real write would, including admission webhooks, and answer as it would, without persisting anything.
    The response body is the object as it would be stored, and errors and `Warning` headers are those of the real write.
    A write that does not accept the parameter rejects it with 400.
tags:
  - name: Kubernetes
    description: Everything related to the Kubernetes Clusters
  - name: General info
    description: General information about the Everest installation
  - name: Authentication & Authorization
    description: Everything related to authentication and authorization
  - name: Provider
    description: Everything related to providers
  - name: Plugin
    description: Everything related to generic plugins
  - name: Instance
    description: Everything related to instances
  - name: Preset
    description: Everything related to presets
  - name: Backup
    description: Everything related to backups
  - name: Backup Import
    description: Everything related to backup imports
  - name: Restore
    description: Everything related to restores
  - name: Backup Storage
    description: Everything related to backup storage
  - name: Monitoring
    description: Everything related to monitoring
security:
  - BearerAuth: []
paths:
  '/auth/token':
    post:
      tags:
        - Authentication & Authorization
      security: []
      summary: Issue API tokens
      description: |
        OAuth 2.0-style token endpoint (RFC 6749). Issues a short-lived access JWT
        together with a rotatable refresh token.

        Supported grant types:
        - `password` — log in with username/password. The user must have the `login` capability.
        - `refresh_token` — exchange a refresh token for a new token pair. The presented
          refresh token is rotated (consumed and replaced).

        When `refresh_token_delivery` is set to `cookie`, the refresh token is returned in an
        `HttpOnly` cookie instead of the response body. For the `refresh_token` grant the
        refresh token may then be omitted from the request body; it is read from the cookie.
      operationId: createAuthToken
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: Unsuccessful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        description: The token request
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthTokenRequest'
  '/auth/revoke':
    post:
      tags:
        - Authentication & Authorization
      security: []
      summary: Revoke API tokens (logout)
      description: |
        Revokes the supplied refresh token (or the one carried by the refresh token cookie)
        and, if a valid access JWT is present in the Authorization header, adds it to the
        blocklist until it expires. Inspired by RFC 7009.

        This endpoint is intentionally unauthenticated: the refresh token itself is the
        proof of session ownership. Callers with an expired (or absent) access token can
        still log out cleanly by presenting only their refresh token.
      operationId: revokeAuthToken
      responses:
        '204':
          description: Successful operation
        '429':
          description: Too many attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        description: The token to revoke
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRevokeRequest'

  '/permissions':
    get:
      tags:
        - Authentication & Authorization
      summary: Get user permissions
      description: |
        This API returns a list of permissions for the user that is currently logged in.
        
        *Example:*
        Assume the following RBAC policy, and users `alice` and `bob`:
        ```
        p, role:dev, namespaces, read, *
        p, role:dev, database-engines, *, */*
        p, role:dev, database-clusters, *, */*
        p, bob, database-clusters, *, */*
        g, alice, role:dev
        ```
        The API will return the following permissions for `alice`:
        ```
        {
          "permissions": [
            [
                "alice",
                "namespaces",
                "read",
                "*"
            ],
            [
                "alice",
                "database-engines",
                "*",
                "*/*"
            ],
            [
                "alice",
                "database-clusters",
                "*",
                "*/*"
            ]
          ]
        }
        ```
        And the following permissions for `bob`:
        ```
        {
          "permissions": [
            [
                "bob",
                "database-clusters",
                "*",
                "*/*"
            ]
          ]
        }
        ```
      operationId: getUserPermissions
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPermissions'
        '400':
          description: Unsuccessful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/version':
    get:
      tags:
        - General info
      summary: Version
      description: |
        This API returns the version of the Everest API server.
      operationId: versionInfo
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
  '/settings':
    get:
      tags:
        - General info
      security: []
      summary: Settings
      description: This API returns the settings of the Everest installation.
      operationId: getSettings
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
  '/resources':
    get:
      tags:
        - Kubernetes
      summary: Cluster resources
      description: |
        This API gets the capacity and available resources of the Kubernetes cluster.
      operationId: getKubernetesClusterResources
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesClusterResources'
        '400':
          description: Unsuccessful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/cluster-info':
    get:
      tags:
        - Kubernetes
      summary: Cluster info
      description: |
        This API gets the cluster type and the storage classes available in the cluster.
      operationId: getKubernetesClusterInfo
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesClusterInfo'
        '400':
          description: Unsuccessful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/clusters':
    x-everest-resource-name: clusters
    get:
      tags:
        - Kubernetes
      summary: List clusters
      description: List all clusters stored in Everest.
      operationId: listClusters
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterList'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/clusters/{name}':
    x-everest-resource-name: clusters
    get:
      tags:
        - Kubernetes
      summary: Get cluster
      description: Get a cluster by name.
      operationId: getCluster
      parameters:
        - name: name
          in: path
          description: Name of the cluster
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cluster'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Cluster not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/clusters/{cluster}/namespaces':
    x-everest-resource-name: namespaces
    get:
      tags:
        - General info
      summary: Managed namespaces
      description: |
        This API returns a list of namespaces managed by Everest.
      operationId: listNamespaces
      parameters:
        - name: cluster
          in: path
          required: true
          description: The name of the cluster
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NamespaceList'
  '/clusters/{cluster}/cluster-instance-presets':
    x-everest-resource-name: cluster-instance-presets
    get:
      tags:
        - Preset
      summary: List cluster instance presets
      description: |
        This API lists all cluster instance presets in the specified cluster.
        Optionally filter by provider.
      operationId: listClusterInstancePresets
      parameters:
        - name: cluster
          in: path
          required: true
          description: The name of the cluster
          schema:
            type: string
        - name: provider
          in: query
          required: false
          description: Filter presets by provider name
          schema:
            type: string
      responses:
        '200':
          description: List of cluster instance presets
          content:
            application/json:
              schema:
                $ref: 'crds.gen.yaml#/components/schemas/ClusterInstancePresetList'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/clusters/{cluster}/cluster-instance-presets/{name}':
    x-everest-resource-name: cluster-instance-presets
    get:
      tags:
        - Preset
      summary: Get cluster instance preset
      description: |
        This API gets the cluster instance preset specified by the `name` in the specified `cluster`.
      operationId: getClusterInstancePreset
      parameters:
        - name: cluster
          in: path
          required: true
          description: The name of the cluster
          schema:
            type: string
        - name: name
          in: path
          required: true
          description: The name of the cluster instance preset
          schema:
            type: string
      responses:
        '200':
          description: Cluster instance preset details
          content:
            application/json:
              schema:
                $ref: 'crds.gen.yaml#/components/schemas/ClusterInstancePreset'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Cluster instance preset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/clusters/{cluster}/namespaces/{namespace}/instance-presets':
    x-everest-resource-name: instance-presets
    get:
      tags:
        - Preset
      summary: List instance presets
      description: |
        This API lists all instance presets in the specified namespace and cluster.
        Optionally filter by provider.
      operationId: listInstancePresets
      parameters:
        - name: cluster
          in: path
          required: true
          description: The name of the cluster
          schema:
            type: string
        - name: namespace
          in: path
          required: true
          description: The namespace where instance presets are located
          schema:
            type: string
        - name: provider
          in: query
          required: false
          description: Filter presets by provider name
          schema:
            type: string
      responses:
        '200':
          description: List of instance presets
          content:
            application/json:
              schema:
                $ref: 'crds.gen.yaml#/components/schemas/InstancePresetList'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Preset
      summary: Create instance preset
      description: |
        This API creates a new instance preset in the specified namespace and cluster.
      operationId: createInstancePreset
      parameters:
        - name: cluster
          in: path
          required: true
          description: The name of the cluster
          schema:
            type: string
        - name: namespace
          in: path
          required: true
          description: The namespace where the instance preset will be created
          schema:
            type: string
      requestBody:
        description: The instance preset object to be created
        required: true
        content:
          application/json:
            schema:
              $ref: 'crds.gen.yaml#/components/schemas/InstancePreset'
      responses:
        '201':
          description: Instance preset created successfully
          content:
            application/json:
              schema:
                $ref: 'crds.gen.yaml#/components/schemas/InstancePreset'
        '400':
          description: Unsuccessful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Namespace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/clusters/{cluster}/namespaces/{namespace}/instance-presets/{name}':
    x-everest-resource-name: instance-presets
    get:
      tags:
        - Preset
      summary: Get instance preset
      description: |
        This API gets the instance preset specified by the `name` in the specified `namespace` and `cluster`.
      operationId: getInstancePreset
      parameters:
        - name: cluster
          in: path
          required: true
          description: The name of the cluster
          schema:
            type: string
        - name: namespace
          in: path
          required: true
          description: The namespace where the instance preset is located
          schema:
            type: string
        - name: name
          in: path
          required: true
          description: The name of the instance preset
          schema:
            type: string
      responses:
        '200':
          description: Instance preset details
          content:
            application/json:
              schema:
                $ref: 'crds.gen.yaml#/components/schemas/InstancePreset'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Instance preset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Preset
      summary: Update instance preset
      description: |
        This API updates the instance preset specified by the `name` in the specified `namespace` and `cluster`,
        replacing the entire resource with the new one.
      operationId: updateInstancePreset
      parameters:
        - name: cluster
          in: path
          required: true
          description: The name of the cluster
          schema:
            type: string
        - name: namespace
          in: path
          required: true
          description: The namespace where the instance preset is located
          schema:
            type: string
        - name: name
          in: path
          required: true
          description: The name of the instance preset
          schema:
            type: string
      requestBody:
        description: The instance preset object to be updated
        required: true
        content:
          application/json:
            schema:
              $ref: 'crds.gen.yaml#/components/schemas/InstancePreset'
      responses:
        '200':
          description: Instance preset updated successfully
          content:
            application/json:
              schema:
                $ref: 'crds.gen.yaml#/components/schemas/InstancePreset'
        '400':
          description: Unsuccessful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Instance preset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Preset
      summary: Delete instance preset
      description: |
        This API deletes the instance preset specified by the `name` in the specified `namespace` and `cluster`.
      operationId: deleteInstancePreset
      parameters:
        - name: cluster
          in: path
          required: true
          description: The name of the cluster
          schema:
            type: string
        - name: namespace
          in: path
          required: true
          description: The namespace where the instance preset is located
          schema:
            type: string
        - name: name
          in: path
          required: true
          description: The name of the instance preset
          schema:
            type: string
      responses:
        '204':
          description: Instance preset deleted successfully
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Instance preset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/clusters/{cluster}/providers':
    x-everest-resource-name: providers
    get:
      tags:
        - Provider
      summary: List providers
      description: |
        This API lists all database providers in the specified cluster.
      operationId: listProviders
      parameters:
        - name: cluster
          in: path
          required: true
          description: The name of the cluster
          schema:
            type: string
      responses:
        '200':
          description: List of providers
          content:
            application/json:
              schema:
                $ref: 'crds.gen.yaml#/components/schemas/ProviderList'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/clusters/{cluster}/providers/{provider}':
    x-everest-resource-name: providers
    get:
      tags:
        - Provider
      summary: Get provider
      description: |
        This API gets the database provider specified by the `provider` name in the specified `cluster`.
      operationId: getProvider
      parameters:
        - name: cluster
          in: path
          required: true
          description: The name of the cluster
          schema:
            type: string
        - name: provider
          in: path
          required: true
          description: The name of the provider
          schema:
            type: string
      responses:
        '200':
          description: Provider details
          content:
            application/json:
              schema:
                $ref: 'crds.gen.yaml#/components/schemas/Provider'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Provider not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/clusters/{cluster}/plugins':
    x-everest-resource-name: plugins
    get:
      tags:
        - Plugin
      summary: List plugins
      description: |
        This API lists the enabled generic plugins available in the specified cluster
        that the caller is permitted to see. The response drives the frontend plugin
        loader and the CLI plugin discovery.
      operationId: listPlugins
      parameters:
        - name: cluster
          in: path
          required: true
          description: The name of the cluster
          schema:
            type: string
      responses:
        '200':
          description: List of plugins
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginDescriptorList'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/clusters/{cluster}/plugin-context':
    x-everest-resource-name: plugins
    get:
      tags:
        - Plugin
      summary: Get plugin context
      description: |
        This API returns the calling user's identity and the namespaces they can
        access in the specified cluster. Plugins use it to scope their queries per
        tenant.
      operationId: getPluginContext
      parameters:
        - name: cluster
          in: path
          required: true
          description: The name of the cluster
          schema:
            type: string
      responses:
        '200':
          description: Plugin context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginContext'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/clusters/{cluster}/namespaces/{namespace}/instances':
    x-everest-resource-name: instances
    get:
      tags:
        - Instance
      summary: List instances
      description: |
        This API lists all database instances in the specified namespace and cluster.
      operationId: listInstances
      parameters:
        - name: cluster
          in: path
          required: true
          description: The name of the cluster
          schema:
            type: string
        - name: namespace
          in: path
          required: true
          description: The namespace where instances are located
          schema:
            type: string
      responses:
        '200':
          description: List of instances
          content:
            application/json:
              schema:
                $ref: 'crds.gen.yaml#/components/schemas/InstanceList'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Instance
      summary: Create instance
      description: |
        This API creates a new database instance in the specified namespace and cluster.
        Every monitoring destination listed in `spec.monitoring.destinations` requires `read` on it; otherwise the request fails with 403.
      operationId: createInstance
      parameters:
        - name: cluster
          in: path
          required: true
          description: The name of the cluster
          schema:
            type: string
        - name: namespace
          in: path
          required: true
          description: The namespace where the instance will be created
          schema:
            type: string
        - $ref: '#/components/parameters/DryRun'
      requestBody:
        description: The instance object to be created
        required: true
        content:
          application/json:
            schema:
              $ref: 'crds.gen.yaml#/components/schemas/Instance'
      responses:
        '200':
          description: Instance created successfully
          headers:
            Warning:
              $ref: '#/components/headers/Warning'
          content:
            application/json:
              schema:
                $ref: 'crds.gen.yaml#/components/schemas/Instance'
        '201':
          description: Instance created successfully
          headers:
            Warning:
              $ref: '#/components/headers/Warning'
          content:
            application/json:
              schema:
                $ref: 'crds.gen.yaml#/components/schemas/Instance'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Namespace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '422':
          description: Validation failed
          headers:
            Warning:
              $ref: '#/components/headers/Warning'
